.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7}
.o1{width:300px;height:300px;left:-60px;top:160px;background:oklch(0.72 0.08 75 / .5);animation:o1 26s ease-in-out infinite alternate}
.o2{width:280px;height:280px;right:-90px;top:420px;background:oklch(0.5 0.09 250 / .55);animation:o2 32s ease-in-out infinite alternate}

.lensmove{transition:left .55s cubic-bezier(.3,1.35,.45,1),top .55s cubic-bezier(.3,1.35,.45,1)}
.colmove{transition:transform .6s cubic-bezier(.3,1.25,.45,1)}

<script>

class DCLogic { constructor(props){ this.props = props; this.state = {}; } setState(p){ Object.assign(this.state, p); __render(); } forceUpdate(){ __render(); } }

const NUMS = [3, 5, 7, 10, 15, 20];
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const dur = s.dur ?? 7, before = s.before === undefined ? 2 : s.before, after = s.after ?? 4;
    const idx = NUMS.indexOf(dur), ROW = 150;
    const rowList = (val, key) => [1, 2, 3, 4, 5].map((n) => ({ n: n, on: n === val, aria: n + ' z 5' + (n === 1 ? ', napięty' : n === 5 ? ', spokojny' : ''), pick: () => this.setState({ [key]: n }),
      style: 'height:92px;border:none;background:transparent;font-family:\'Instrument Serif\',serif;line-height:1;transition:font-size .4s,color .4s;font-size:' + (n === val ? 60 : 34) + 'px;color:' + (n === val ? '#fff' : 'oklch(0.5 0.008 240)') + ';position:relative;z-index:' + (n === val ? 2 : 0) }));
    const lens = (val) => 'position:absolute;top:8px;width:76px;height:76px;margin-left:-38px;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.08);transition:left .55s cubic-bezier(.3,1.35,.45,1),opacity .3s;left:calc(' + (((val || 1) - 0.5) * 20) + '%);opacity:' + (val === null ? 0 : 1);
    const delta = before !== null ? after - before : null;
    return {
      dur: dur,
      col: 'position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;transition:transform .6s cubic-bezier(.3,1.25,.45,1);transform:translateY(' + (235 - ROW / 2 - idx * ROW) + 'px)',
      nums: NUMS.map((n, i) => ({ v: n, aria: n + ' minut', pick: () => this.setState({ dur: n }),
        style: 'height:' + ROW + 'px;border:none;background:transparent;font-family:\'Instrument Serif\',serif;font-size:150px;line-height:1;filter:blur(' + (Math.abs(i - idx) * 1.5) + 'px);color:oklch(1 0 0 / ' + (i === idx ? 0 : Math.max(0.08, 0.32 - Math.abs(i - idx) * 0.1)) + ')' })),
      before: rowList(before, 'before'), lensB: lens(before), skipBefore: () => this.setState({ before: null }), skipLabel: before === null ? 'Pominięte' : 'Pomiń',
      after: rowList(after, 'after'), lensA: lens(after),
      deltaLabel: delta === null ? 'bez oceny „przed”' : (delta > 0 ? '+' : '') + delta + ' względem „przed”',
      deltaStyle: 'height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;font-size:13px;font-weight:700;' + (delta > 0 ? 'background:rgba(214,208,192,.18);color:#D6D0C0' : 'background:rgba(255,255,255,.08);color:oklch(0.75 0.008 240)'),
      note: s.note ?? '', onNote: (e) => this.setState({ note: e.target.value })
    };
  }
}

(function(){
  const props = {};
  const comp = new Component(props);
  const tpl = document.getElementById('dc-tpl');
  const root = document.getElementById('dc-root');
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(path, scope){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((o,k)=> o == null ? undefined : o[k], scope);
  }
  function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
  function proc(node, scope){
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
    if (node.nodeType !== 1) { if (node.nodeType === 8) node.remove(); return; }
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      const list = (m ? look(m[1], scope) : []) || [];
      const as = node.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        Array.from(node.childNodes).forEach(c => { const cl = c.cloneNode(true); const holder = document.createElement('div'); holder.appendChild(cl); proc(cl, s); while (holder.firstChild) frag.appendChild(holder.firstChild); });
      });
      node.replaceWith(frag); return;
    }
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (!(m && look(m[1], scope))) { node.remove(); return; }
      Array.from(node.childNodes).forEach(c => proc(c, scope));
      node.replaceWith(...Array.from(node.childNodes)); return;
    }
    for (const a of Array.from(node.attributes)) {
      if (a.name.startsWith('hint-')) { node.removeAttribute(a.name); continue; }
      if (!a.value.includes('{{')) continue;
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (a.name.startsWith('on') && whole) {
        node.removeAttribute(a.name);
        const fn = look(whole[1], scope);
        if (typeof fn === 'function') node.addEventListener(a.name.slice(2), fn);
        continue;
      }
      node.setAttribute(a.name, interp(a.value, scope));
    }
    Array.from(node.childNodes).forEach(c => proc(c, scope));
  }
  window.__render = function(){
    const saved = {}, ae = document.activeElement, focusId = ae && ae.id;
    let caret = null; try { caret = ae && ae.selectionStart; } catch (e) {}
    root.querySelectorAll('input[id],select[id],textarea[id]').forEach(e => { if (e.type === 'file') return; saved[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
    const frag = tpl.content.cloneNode(true);
    const vals = comp.renderVals();
    Array.from(frag.childNodes).forEach(c => proc(c, vals));
    root.replaceChildren(frag);
    Object.keys(saved).forEach(id => { const e = document.getElementById(id); if (!e || e.type === 'file' || e.hasAttribute('value') && e.type !== 'date') return; if (e.type === 'checkbox') e.checked = saved[id]; else e.value = saved[id]; });
    if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); try { if (caret != null) f.setSelectionRange(caret, caret); } catch (e) {} } }
  };
  __render();
  if (typeof comp.componentDidMount === 'function') comp.componentDidMount();
})();
