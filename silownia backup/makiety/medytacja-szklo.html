<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medytacja – szkło</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:oklch(0.05 0.004 250)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #D6D0C0;outline-offset:3px}
input::placeholder,textarea::placeholder{color:oklch(0.48 0.008 240)}
.lg{position:relative;isolation:isolate;background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(3px) saturate(170%) brightness(1.08);backdrop-filter:url(#refract) blur(3px) saturate(170%) brightness(1.08);box-shadow:inset 1.5px 1.5px 0 -0.5px rgba(255,255,255,.55),inset -1px -1px 0 -0.5px rgba(255,255,255,.25),inset 0 0 22px rgba(255,255,255,.07),0 18px 40px -16px rgba(0,0,0,.65)}
.lg::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(140deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.08) 100%)}
.lg.tint{background:rgba(214,208,192,.26)}
.mdrop{animation:mdrop 9s ease-in-out infinite}@keyframes mdrop{0%,100%{border-radius:58% 42% 55% 45% / 52% 48% 52% 48%}33%{border-radius:45% 55% 40% 60% / 60% 42% 58% 40%}66%{border-radius:52% 48% 62% 38% / 45% 58% 42% 55%}}
.tw{animation:tw 3.4s ease-in-out infinite;opacity:.15}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.6}}
.press{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}.press:active{transform:scale(.95)}
.breath{animation:breath 16s ease-in-out infinite}@keyframes breath{0%,100%{transform:scale(.82)}50%{transform:scale(1.08)}}
.breathtxt::after{content:''}
@media (prefers-reduced-motion: reduce){.mdrop,.tw,.breath{animation:none}.press{transition:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 2660px; min-height: 2060px; box-sizing: border-box; padding: 48px 60px; background: oklch(0.05 0.004 250); color: oklch(0.85 0.005 240); font-family: 'Plus Jakarta Sans', sans-serif">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true"><filter id="refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.009 0.012" numOctaves="2" seed="3" result="n"></feTurbulence><feGaussianBlur in="n" stdDeviation="2" result="nb"></feGaussianBlur><feDisplacementMap in="SourceGraphic" in2="nb" scale="38" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter></svg>
  <span style="font-size: 12px; font-weight: 700; letter-spacing: .16em; color: oklch(0.5 0.008 240)">SILOWNIA · MAKIETA</span>
  <h1 style="margin: 6px 0 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 54px; line-height: 1; color: oklch(0.97 0.004 240)">Medytacja – szkło</h1>
  <p style="margin: 10px 0 0; max-width: 820px; font-size: 14px; line-height: 1.5; color: oklch(0.6 0.008 240)">Sześć widoków jednego ekranu. Wszystkie liczby, daty i notatki to dane demo. Przyciski i krople mają min. 44 px, pola tekstowe 16 px, dół ekranu zostawia miejsce na pasek systemu (safe-area), a animacje wyłączają się przy „ogranicz ruch”.</p>
  <div style="display: flex; align-items: flex-start; gap: 40px; margin-top: 32px">
<div style="flex: none; width: 390px">
  <span style="display: block; font-size: 15px; font-weight: 700; color: oklch(0.93 0.004 240)">1 · Start + podsumowanie</span>
  <span style="display: block; height: 36px; margin-top: 4px; font-size: 12.5px; line-height: 1.45; color: oklch(0.58 0.008 240)">Wybór czasu, ocena „przed”, start. Pod spodem przewijane podsumowanie praktyki.</span>
  <div class="phone" style="position: relative; height: 1800px; margin-top: 12px; border-radius: 44px; overflow: hidden; border: 1px solid oklch(0.2 0.008 245); background: radial-gradient(420px 320px at 80% 140px, oklch(0.72 0.08 75 / 0.16), transparent 70%), radial-gradient(360px 300px at 0% 520px, oklch(0.45 0.06 250 / 0.22), transparent 70%), oklch(0.07 0.004 250)">
    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><span class="tw" style="position:absolute;left:0%;top:0px;width:1px;height:1px;border-radius:50%;background:#e6e9f2;animation-delay:0.00s"></span><span class="tw" style="position:absolute;left:84%;top:324px;width:2px;height:2px;border-radius:50%;background:#e6e9f2;animation-delay:0.37s"></span><span class="tw" style="position:absolute;left:89%;top:175px;width:3px;height:3px;border-radius:50%;background:#e6e9f2;animation-delay:0.74s"></span><span class="tw" style="position:absolute;left:97%;top:457px;width:1px;height:1px;border-radius:50%;background:#e6e9f2;animation-delay:1.11s"></span><span class="tw" style="position:absolute;left:16%;top:166px;width:2px;height:2px;border-radius:50%;background:#e6e9f2;animation-delay:1.48s"></span><span class="tw" style="position:absolute;left:58%;top:193px;width:3px;height:3px;border-radius:50%;background:#e6e9f2;animation-delay:1.85s"></span><span class="tw" style="position:absolute;left:96%;top:357px;width:1px;height:1px;border-radius:50%;background:#e6e9f2;animation-delay:2.22s"></span><span class="tw" style="position:absolute;left:68%;top:515px;width:2px;height:2px;border-radius:50%;background:#e6e9f2;animation-delay:2.59s"></span><span class="tw" style="position:absolute;left:85%;top:22px;width:3px;height:3px;border-radius:50%;background:#e6e9f2;animation-delay:2.96s"></span><span class="tw" style="position:absolute;left:95%;top:359px;width:1px;height:1px;border-radius:50%;background:#e6e9f2;animation-delay:3.33s"></span><span class="tw" style="position:absolute;left:15%;top:334px;width:2px;height:2px;border-radius:50%;background:#e6e9f2;animation-delay:0.30s"></span><span class="tw" style="position:absolute;left:10%;top:268px;width:3px;height:3px;border-radius:50%;background:#e6e9f2;animation-delay:0.67s"></span><span class="tw" style="position:absolute;left:29%;top:122px;width:1px;height:1px;border-radius:50%;background:#e6e9f2;animation-delay:1.04s"></span><span class="tw" style="position:absolute;left:56%;top:218px;width:2px;height:2px;border-radius:50%;background:#e6e9f2;animation-delay:1.41s"></span><span class="tw" style="position:absolute;left:1%;top:430px;width:3px;height:3px;border-radius:50%;background:#e6e9f2;animation-delay:1.78s"></span><span class="tw" style="position:absolute;left:15%;top:448px;width:1px;height:1px;border-radius:50%;background:#e6e9f2;animation-delay:2.15s"></span><span class="tw" style="position:absolute;left:78%;top:377px;width:2px;height:2px;border-radius:50%;background:#e6e9f2;animation-delay:2.52s"></span><span class="tw" style="position:absolute;left:68%;top:46px;width:3px;height:3px;border-radius:50%;background:#e6e9f2;animation-delay:2.89s"></span></div>
    <div style="position: relative; padding: 56px 20px calc(34px + env(safe-area-inset-bottom))"><div style="display: flex; align-items: center; justify-content: space-between">
  <button aria-label="Menu" class="mdrop" style="position: relative; width: 56px; height: 56px; flex: none; padding: 0; border: none; background: #D6D0C0; box-shadow: 0 14px 30px -14px rgba(214,208,192,0.6)"><span style="position:absolute;left:18px;top:23px;width:20px;height:2px;border-radius:2px;background:oklch(0.1 0.006 250)"></span><span style="position:absolute;left:18px;top:31px;width:12px;height:2px;border-radius:2px;background:oklch(0.1 0.006 250)"></span></button>
  <span style="text-align: right; font-size: 13px; line-height: 1.35; color: oklch(0.55 0.008 240)">czwartek<br><span style="color: oklch(0.82 0.005 240)">15 października</span></span>
</div><h1 style="margin: 24px 4px 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 46px; line-height: .95; color: oklch(0.96 0.004 240)">Medytacja</h1>
<section class="lg" style="margin-top: 20px; padding: 22px 18px 18px; border-radius: 36px">
  <span style="display: block; text-align: center; font-size: 13px; font-weight: 600; color: oklch(0.62 0.008 240)">Ile dziś?</span>
  <div style="display: flex; justify-content: center; align-items: baseline; gap: 8px; margin-top: 2px">
    <span style="font-family: 'Instrument Serif', serif; font-size: 112px; line-height: .95; color: oklch(0.97 0.004 240); font-variant-numeric: tabular-nums">{{dur}}</span><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 32px; color: #D6D0C0">min</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 12px">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" class="press" style="{{c.style}}">{{c.label}}</button>
    </sc-for>
  </div>
  <sc-if value="{{customOpen}}" hint-placeholder-val="{{ false }}">
    <label style="display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 0 16px; height: 48px; border-radius: 999px; background: rgba(0,0,0,.25); box-shadow: inset 0 1px 3px rgba(0,0,0,.45)">
      <span style="font-size: 14px; color: oklch(0.6 0.008 240)">Własny czas</span>
      <input id="wlasny" value="{{custom}}" onInput="{{onCustom}}" inputmode="numeric" aria-label="Własny czas w minutach" style="flex: 1; min-width: 0; height: 44px; border: none; background: transparent; text-align: right; font-size: 16px; font-weight: 700; color: oklch(0.95 0.004 240); outline: none">
      <span style="font-size: 14px; color: oklch(0.6 0.008 240)">min</span>
    </label>
  </sc-if>
</section>
<section class="lg" style="margin-top: 12px; padding: 18px 16px 12px; border-radius: 32px">
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
    <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; color: oklch(0.94 0.004 240)">Jak czujesz się teraz?</span>
    <button onClick="{{skipBefore}}" style="min-height: 44px; padding: 0 4px; border: none; background: transparent; font-size: 13px; font-weight: 600; color: oklch(0.6 0.008 240)">{{skipLabel}}</button>
  </div>
  <div role="radiogroup" style="display: flex; justify-content: space-between; margin-top: 12px">
  <sc-for list="{{before}}" as="d" hint-placeholder-count="5">
    <button onClick="{{d.pick}}" role="radio" aria-checked="{{d.on}}" aria-label="{{d.aria}}" class="press" style="width: 56px; height: 64px; padding: 0; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="36" height="40" viewBox="0 0 24 24" aria-hidden="true" style="{{d.glow}}"><path d="M12 2C12 2 4.5 10.2 4.5 14.8a7.5 7.5 0 0 0 15 0C19.5 10.2 12 2 12 2Z" fill="{{d.fill}}" stroke="{{d.stroke}}" stroke-width="1.3"></path></svg>
      <span style="{{d.ls}}">{{d.n}}</span>
    </button>
  </sc-for>
</div>
<div style="display: flex; justify-content: space-between; padding: 0 8px; margin-top: 2px; font-size: 11.5px; color: oklch(0.5 0.008 240)"><span>napięty</span><span>spokojny</span></div>
</section>
<button class="lg tint press" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 66px; margin-top: 14px; border: none; border-radius: 999px; font-size: 18px; font-weight: 700; color: oklch(0.97 0.004 240)">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>Zacznij {{dur}} min</button>
<p style="display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0 0; font-size: 13px; color: oklch(0.58 0.008 240)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Możesz zablokować ekran, gong zabrzmi na końcu</p>
<a href="#" style="display: block; min-height: 44px; margin-top: 4px; line-height: 44px; text-align: center; font-size: 14px; font-weight: 600; color: #D6D0C0; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: oklch(0.72 0.08 75 / .5)">Zaliczyłem bez timera</a><div style="display: flex; align-items: baseline; justify-content: space-between; margin: 34px 4px 0"><h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 28px; color: oklch(0.94 0.004 240)">Twoja praktyka</h2><span style="font-size: 13px; color: oklch(0.55 0.008 240)">ostatnie 14 dni</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px">
  <div class="lg" style="padding: 16px; border-radius: 26px"><span style="font-size: 12.5px; color: oklch(0.6 0.008 240)">Seria</span><span style="display: block; margin-top: 2px; font-family: 'Instrument Serif', serif; font-size: 44px; line-height: 1; color: oklch(0.97 0.004 240)">6 <span style="font-style: italic; font-size: 20px; color: #D6D0C0">dni</span></span></div>
  <div class="lg" style="padding: 16px; border-radius: 26px"><span style="font-size: 12.5px; color: oklch(0.6 0.008 240)">Łącznie</span><span style="display: block; margin-top: 2px; font-family: 'Instrument Serif', serif; font-size: 44px; line-height: 1; color: oklch(0.97 0.004 240)">84 <span style="font-style: italic; font-size: 20px; color: #D6D0C0">min</span></span></div>
</div>
<section class="lg" style="margin-top: 10px; padding: 18px; border-radius: 30px">
  <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; color: oklch(0.94 0.004 240)">Cel tygodnia</span><span style="font-size: 13px; font-weight: 700; color: #D6D0C0">{{goalLabel}}</span></div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px">
    <sc-for list="{{week}}" as="w" hint-placeholder-count="7"><span style="display: flex; flex-direction: column; align-items: center; gap: 4px"><svg width="22" height="22" viewBox="0 0 30 30" aria-hidden="true" style="{{w.glow}}"><path d="M15 2C16 11 19 14 28 15C19 16 16 19 15 28C14 19 11 16 2 15C11 14 14 11 15 2Z" fill="{{w.fill}}" stroke="{{w.stroke}}" stroke-width="1.4"></path></svg><span style="{{w.ls}}">{{w.d}}</span></span></sc-for>
  </div>
  <sc-if value="{{showProposal}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px 12px 12px 16px; border-radius: 22px; background: rgba(214,208,192,.10); box-shadow: inset 0 0 0 1px rgba(214,208,192,.25)">
      <span style="flex: 1; font-size: 13.5px; line-height: 1.4; color: oklch(0.85 0.005 240)">6 dni z 7 zaliczone. Spróbujesz <b style="color: #D6D0C0">8 min</b> od przyszłego tygodnia?</span>
      <button onClick="{{acceptGoal}}" class="lg tint press" style="height: 44px; padding: 0 16px; flex: none; border: none; border-radius: 999px; font-size: 14px; font-weight: 700; color: oklch(0.97 0.004 240)">+1 min</button>
    </div>
  </sc-if>
</section>
<section class="lg" style="margin-top: 10px; padding: 18px 18px 14px; border-radius: 30px">
  <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; color: oklch(0.94 0.004 240)">Przed i po</span><span style="display: inline-flex; gap: 12px; font-size: 12px; color: oklch(0.6 0.008 240)"><span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid oklch(0.6 0.008 240)"></span> przed</span><span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #D6D0C0"></span> po</span></span></div>
  <svg viewBox="0 0 310 130" width="100%" style="display: block; margin-top: 10px" role="img" aria-label="Ocena przed i po ostatnich 7 sesjach, średnio +1,6">
    <g stroke="oklch(1 0 0 / 0.06)"><line x1="18" x2="310" y1="10" y2="10"></line><line x1="18" x2="310" y1="35" y2="35"></line><line x1="18" x2="310" y1="60" y2="60"></line><line x1="18" x2="310" y1="85" y2="85"></line><line x1="18" x2="310" y1="110" y2="110"></line></g>
    <g font-size="10" fill="oklch(0.5 0.008 240)" font-family="Plus Jakarta Sans"><text x="0" y="14">5</text><text x="0" y="39">4</text><text x="0" y="64">3</text><text x="0" y="89">2</text><text x="0" y="114">1</text></g>
    <line x1="40" x2="40" y1="85" y2="35" stroke="#D6D0C0" stroke-width="2" opacity=".45"></line><circle cx="40" cy="85" r="5" fill="oklch(0.07 0.004 250)" stroke="oklch(0.6 0.008 240)" stroke-width="1.6"></circle><circle cx="40" cy="35" r="5.5" fill="#D6D0C0"></circle><line x1="82" x2="82" y1="60" y2="35" stroke="#D6D0C0" stroke-width="2" opacity=".45"></line><circle cx="82" cy="60" r="5" fill="oklch(0.07 0.004 250)" stroke="oklch(0.6 0.008 240)" stroke-width="1.6"></circle><circle cx="82" cy="35" r="5.5" fill="#D6D0C0"></circle><line x1="124" x2="124" y1="85" y2="60" stroke="#D6D0C0" stroke-width="2" opacity=".45"></line><circle cx="124" cy="85" r="5" fill="oklch(0.07 0.004 250)" stroke="oklch(0.6 0.008 240)" stroke-width="1.6"></circle><circle cx="124" cy="60" r="5.5" fill="#D6D0C0"></circle><line x1="166" x2="166" y1="110" y2="60" stroke="#D6D0C0" stroke-width="2" opacity=".45"></line><circle cx="166" cy="110" r="5" fill="oklch(0.07 0.004 250)" stroke="oklch(0.6 0.008 240)" stroke-width="1.6"></circle><circle cx="166" cy="60" r="5.5" fill="#D6D0C0"></circle><line x1="208" x2="208" y1="60" y2="10" stroke="#D6D0C0" stroke-width="2" opacity=".45"></line><circle cx="208" cy="60" r="5" fill="oklch(0.07 0.004 250)" stroke="oklch(0.6 0.008 240)" stroke-width="1.6"></circle><circle cx="208" cy="10" r="5.5" fill="#D6D0C0"></circle><line x1="250" x2="250" y1="85" y2="35" stroke="#D6D0C0" stroke-width="2" opacity=".45"></line><circle cx="250" cy="85" r="5" fill="oklch(0.07 0.004 250)" stroke="oklch(0.6 0.008 240)" stroke-width="1.6"></circle><circle cx="250" cy="35" r="5.5" fill="#D6D0C0"></circle><line x1="292" x2="292" y1="85" y2="35" stroke="#D6D0C0" stroke-width="2" opacity=".45"></line><circle cx="292" cy="85" r="5" fill="oklch(0.07 0.004 250)" stroke="oklch(0.6 0.008 240)" stroke-width="1.6"></circle><circle cx="292" cy="35" r="5.5" fill="#D6D0C0"></circle>
  </svg>
  <span style="display: block; margin-top: 4px; font-size: 13px; color: oklch(0.62 0.008 240)">Średnio <b style="color: #D6D0C0">+1,6</b> po sesji w ostatnich 7 razach.</span>
</section>
<div style="display: flex; align-items: baseline; justify-content: space-between; margin: 34px 4px 0"><h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 28px; color: oklch(0.94 0.004 240)">Ostatnie sesje</h2><span style="font-size: 13px; color: oklch(0.55 0.008 240)"></span></div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px">

<script>

class DCLogic { constructor(props){ this.props = props; this.state = {}; } setState(p){ Object.assign(this.state, p); __render(); } forceUpdate(){ __render(); } }

const DUR = [5, 7, 10, 15];
const WEEK = ['pn', 'wt', 'śr', 'cz', 'pt', 'sb', 'nd'];
const STAR = 'M15 2C16 11 19 14 28 15C19 16 16 19 15 28C14 19 11 16 2 15C11 14 14 11 15 2Z';
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const dur = s.dur ?? 7, custom = s.custom ?? '', customOpen = !!s.customOpen;
    const before = s.before === undefined ? 2 : s.before;
    const after = s.after ?? 4;
    const dropList = (val, key) => [1, 2, 3, 4, 5].map((n) => {
      const on = val !== null && n <= val, sel = n === val;
      return { n: n, on: sel, aria: n + ' z 5' + (n === 1 ? ', napięty' : n === 5 ? ', spokojny' : ''),
        pick: () => this.setState({ [key]: n }),
        fill: on ? 'rgba(214,208,192,' + (0.35 + n * 0.13) + ')' : 'transparent', stroke: on ? '#D6D0C0' : 'oklch(0.45 0.008 245)',
        glow: sel ? 'filter:drop-shadow(0 0 8px rgba(214,208,192,.75))' : '',
        ls: 'font-size:12px;font-weight:700;color:' + (sel ? '#D6D0C0' : 'oklch(0.5 0.008 240)') };
    });
    const delta = before !== null ? after - before : null;
    return {
      dur: customOpen && custom ? custom : dur,
      chips: DUR.map((d) => ({ label: d, on: !customOpen && d === dur, pick: () => this.setState({ dur: d, customOpen: false }),
        style: 'height:48px;border:none;border-radius:999px;font-size:16px;font-weight:700;' + (!customOpen && d === dur ? 'background:rgba(214,208,192,.24);color:#fff;box-shadow:inset 1.5px 1.5px 0 -0.5px rgba(255,255,255,.55),inset 0 0 0 1px rgba(214,208,192,.4)' : 'background:rgba(255,255,255,.05);color:oklch(0.7 0.006 240);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)') }))
        .concat([{ label: 'Własny', on: customOpen, pick: () => this.setState({ customOpen: true }),
        style: 'height:48px;border:none;border-radius:999px;font-size:13px;font-weight:700;' + (customOpen ? 'background:rgba(214,208,192,.24);color:#fff;box-shadow:inset 0 0 0 1px rgba(214,208,192,.4)' : 'background:rgba(255,255,255,.05);color:oklch(0.7 0.006 240);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)') }]),
      customOpen: customOpen, custom: custom, onCustom: (e) => this.setState({ custom: e.target.value.replace(/[^0-9]/g, '').slice(0, 3) }),
      before: dropList(before, 'before'), skipBefore: () => this.setState({ before: null }), skipLabel: before === null ? 'Pominięte' : 'Pomiń',
      after: dropList(after, 'after'),
      deltaLabel: delta === null ? 'bez oceny „przed”' : (delta > 0 ? '+' : '') + delta + ' względem „przed”',
      deltaStyle: 'height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;font-size:13px;font-weight:700;' + (delta > 0 ? 'background:rgba(214,208,192,.16);color:#D6D0C0' : 'background:rgba(255,255,255,.06);color:oklch(0.65 0.008 240)'),
      beforeNote: before === null ? 'Przed sesją pominąłeś ocenę.' : 'Przed sesją: ' + before + ' z 5',
      note: s.note ?? '', onNote: (e) => this.setState({ note: e.target.value }),
      goalLabel: s.goal ? '8 min dziennie' : '7 min dziennie',
      showProposal: !s.goal, acceptGoal: () => this.setState({ goal: true }),
      week: WEEK.map((d, i) => { const ok = i < 6 && i !== 2, today = i === 3; return { d: d, fill: ok ? '#D6D0C0' : 'transparent', stroke: ok ? '#D6D0C0' : 'oklch(0.4 0.008 245)', glow: ok ? 'filter:drop-shadow(0 0 5px rgba(214,208,192,.7))' : '', ls: 'font-size:11px;' + (today ? 'font-weight:700;color:#D6D0C0' : 'color:oklch(0.5 0.008 240)') }; })
    };
  }
}

(function(){
  const props = {};
  const comp = new Component(props);
  const tpl = document.getElementById('dc-tpl');
  const root = document.getElementById('dc-root');
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(path, scope){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((o,k)=> o == null ? undefined : o[k], scope);
  }
  function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
  function proc(node, scope){
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }

        Array.from(node.childNodes).forEach(c => { const cl = c.cloneNode(true); const holder = document.createElement('div'); holder.appendChild(cl); proc(cl, s); while (holder.firstChild) frag.appendChild(holder.firstChild); });
      });
      node.replaceWith(frag); return;
    }

      if (!(m && look(m[1], scope))) { node.remove(); return; }
      Array.from(node.childNodes).forEach(c => proc(c, scope));
      node.replaceWith(...Array.from(node.childNodes)); return;
    }
    for (const a of Array.from(node.attributes)) {
      if (a.name.startsWith('hint-')) { node.removeAttribute(a.name); continue; }
      if (!a.value.includes('{{')) continue;
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (a.name.startsWith('on') && whole) {
        node.removeAttribute(a.name);
        const fn = look(whole[1], scope);
        if (typeof fn === 'function') node.addEventListener(a.name.slice(2), fn);
        continue;
      }
      node.setAttribute(a.name, interp(a.value, scope));
    }
    Array.from(node.childNodes).forEach(c => proc(c, scope));
  }

    const saved = {}, ae = document.activeElement, focusId = ae && ae.id;
    let caret = null; try { caret = ae && ae.selectionStart; } catch (e) {}
    root.querySelectorAll('input[id],select[id],textarea[id]').forEach(e => { if (e.type === 'file') return; saved[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
    const frag = tpl.content.cloneNode(true);
    const vals = comp.renderVals();
    Array.from(frag.childNodes).forEach(c => proc(c, vals));
    root.replaceChildren(frag);
    Object.keys(saved).forEach(id => { const e = document.getElementById(id); if (!e || e.type === 'file' || e.hasAttribute('value') && e.type !== 'date') return; if (e.type === 'checkbox') e.checked = saved[id]; else e.value = saved[id]; });

  };

  if (typeof comp.componentDidMount === 'function') comp.componentDidMount();
})();
