<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zapisz trening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:oklch(0.07 0.004 250)}
a{color:#D6D0C0}a:hover{color:#ffffff}
button{font-family:inherit;cursor:pointer}
.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 390px; min-height: 100vh; margin: 0 auto; padding-bottom: 64px; box-sizing: border-box; background: oklch(0.07 0.004 250); color: oklch(0.85 0.005 240); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 64px; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 56px 24px 0">
    <button aria-label="Menu" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid oklch(0.19 0.008 245); background: oklch(0.1 0.006 250); color: oklch(0.85 0.005 240); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #D6D0C0">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #D6D0C0; box-shadow: 0 0 10px #D6D0C0"></span>
      SESJA · 4 PAŹ
    </span>
  </header>

  <!-- Wybór partii i ćwiczenia -->
  <div class="chips" style="display: flex; gap: 8px; overflow-x: auto; padding: 24px 24px 0">
    <sc-for list="{{parts}}" as="p" hint-placeholder-count="5">
      <button onClick="{{p.pick}}" aria-pressed="{{p.active}}" style="{{p.style}}"><span style="{{p.dot}}"></span>{{p.name}}</button>
    </sc-for>
    <div style="flex: none; width: 8px"></div>
  </div>
  <div class="chips" style="display: flex; gap: 10px; overflow-x: auto; padding: 12px 24px 0">
    <sc-for list="{{exercises}}" as="e" hint-placeholder-count="3">
      <button onClick="{{e.pick}}" aria-pressed="{{e.active}}" style="{{e.style}}">
        <span style="font-size: 14px; font-weight: 600; line-height: 1.25">{{e.name}}</span>
        <span style="{{e.prevStyle}}">{{e.prevLabel}}</span>
      </button>
    </sc-for>
    <div style="flex: none; width: 8px"></div>
  </div>

  <!-- Aktualne ćwiczenie -->
  <section style="margin: 24px 24px 0">
    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.6 0.008 240)"><span style="{{partDot}}"></span>{{partUpper}}</span>
    <h1 style="margin: 8px 0 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 46px; line-height: 0.95; color: oklch(0.95 0.004 240)">{{exTitle}}</h1>
    <sc-if value="{{hasPrev}}" hint-placeholder-val="{{ true }}">
      <div style="margin-top: 16px; display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 14px; background: oklch(0.12 0.015 75); border: 1px solid oklch(0.72 0.08 75 / 0.4)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.72 0.08 75)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.2" fill="oklch(0.72 0.08 75)"></circle></svg>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: oklch(0.72 0.08 75)">DO POBICIA</span>
        <span style="font-family: 'Instrument Serif', serif; font-size: 22px; line-height: 1; color: oklch(0.72 0.08 75)">{{prevLabel}}</span>
      </div>
    </sc-if>
  </section>

  <!-- Duże liczniki -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 20px 24px 0">
    <div style="padding: 16px 14px 14px; border-radius: 24px; background: oklch(0.1 0.006 250); border: 1px solid oklch(0.19 0.008 245); text-align: center">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.52 0.008 240)">CIĘŻAR · KG</span>
      <div style="font-family: 'Instrument Serif', serif; font-size: 72px; line-height: 1.05; color: oklch(0.95 0.004 240)">{{kgLabel}}</div>
      <div style="display: flex; gap: 8px">
        <button onClick="{{kgMinus}}" aria-label="Zmniejsz ciężar o 2,5 kg" style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid oklch(0.22 0.008 245); background: oklch(0.08 0.005 250); color: oklch(0.9 0.004 240); font-size: 22px">−</button>
        <button onClick="{{kgPlus}}" aria-label="Zwiększ ciężar o 2,5 kg" style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid oklch(0.22 0.008 245); background: oklch(0.08 0.005 250); color: oklch(0.9 0.004 240); font-size: 22px">+</button>
      </div>
    </div>
    <div style="padding: 16px 14px 14px; border-radius: 24px; background: oklch(0.1 0.006 250); border: 1px solid oklch(0.19 0.008 245); text-align: center">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.52 0.008 240)">POWTÓRZENIA</span>
      <div style="font-family: 'Instrument Serif', serif; font-size: 72px; line-height: 1.05; color: oklch(0.95 0.004 240)">{{reps}}</div>
      <div style="display: flex; gap: 8px">
        <button onClick="{{repMinus}}" aria-label="Mniej powtórzeń" style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid oklch(0.22 0.008 245); background: oklch(0.08 0.005 250); color: oklch(0.9 0.004 240); font-size: 22px">−</button>
        <button onClick="{{repPlus}}" aria-label="Więcej powtórzeń" style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid oklch(0.22 0.008 245); background: oklch(0.08 0.005 250); color: oklch(0.9 0.004 240); font-size: 22px">+</button>
      </div>
    </div>
  </div>
  <div style="margin: 10px 24px 0; text-align: center; font-size: 13px; font-weight: 600; color: {{beatColor}}">{{beatHint}}</div>

  <button onClick="{{logSet}}" style="margin: 14px 24px 0; width: 342px; height: 64px; border-radius: 22px; border: none; background: #D6D0C0; color: oklch(0.1 0.006 250); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-shadow: 0 18px 40px -16px rgba(214,208,192,0.6)">
    <span>Zalicz serię {{nextNo}}</span>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
  </button>

  <!-- Zaliczone serie -->
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 34px 24px 0">
    <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 28px; color: oklch(0.85 0.005 240)">Zaliczone serie</h2>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: oklch(0.44 0.008 240)">{{logCount}}</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; margin: 14px 24px 0">
    <sc-for list="{{log}}" as="l" hint-placeholder-count="2">
      <div style="{{l.style}}">
        <span style="{{l.stamp}}">{{l.no}}</span>
        <span style="flex: 1; font-family: 'Instrument Serif', serif; font-size: 24px; color: oklch(0.93 0.004 240)">{{l.label}}</span>
        <sc-if value="{{l.record}}" hint-placeholder-val="{{ false }}">
          <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: oklch(0.1 0.006 250); background: oklch(0.72 0.08 75); padding: 5px 10px; border-radius: 999px">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg>
            REKORD
          </span>
        </sc-if>
        <button onClick="{{l.remove}}" aria-label="{{l.removeLabel}}" style="width: 40px; height: 40px; border: none; border-radius: 10px; background: transparent; color: oklch(0.44 0.008 240); display: grid; place-items: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
    </sc-for>
    <sc-if value="{{logEmpty}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; padding: 20px; border-radius: 18px; border: 1.5px dashed oklch(0.19 0.008 245); text-align: center; font-size: 14px; color: oklch(0.52 0.008 240)">Ustaw ciężar i powtórzenia, potem zalicz pierwszą serię.</p>
    </sc-if>
  </div>
  <button style="margin: 16px 24px 0; width: 342px; height: 52px; border-radius: 18px; border: 1px solid oklch(0.26 0.008 245); background: transparent; color: oklch(0.85 0.005 240); font-size: 15px; font-weight: 600">Zapisz ćwiczenie i wybierz kolejne</button>
</div>
</template>
<script>

class DCLogic { constructor(props){ this.props = props; this.state = {}; } setState(p){ Object.assign(this.state, p); __render(); } forceUpdate(){ __render(); } }

const PARTIE = { Klata: '#D6D0C0', Plecy: 'oklch(0.66 0.13 250)', Barki: 'oklch(0.72 0.14 50)', Biceps: 'oklch(0.66 0.15 300)', Triceps: 'oklch(0.7 0.11 180)' };
const KATALOG = {
  Klata: ['rozpiętki na bramie góra', 'rozpiętki na bramie dół', 'rozpiętki hantlami', 'wyciskanie hantlami ławka płaska', 'wyciskanie hantli ławka skośna', 'wyciskanie na maszynie'],
  Plecy: ['wiosłowanie na maszynie wąsko', 'podciąganie'],
  Barki: ['wznosy bokiem w oparciu o ławkę'],
  Biceps: ['biceps gryfem łamanym'],
  Triceps: ['triceps z nad głowy warkoczem']
};
const POPRZEDNIO = {
  'rozpiętki na bramie góra': [50, 9], 'rozpiętki na bramie dół': [30, 10], 'podciąganie': [7.5, 8],
  'wiosłowanie na maszynie wąsko': [115, 10], 'wznosy bokiem w oparciu o ławkę': [15, 10],
  'biceps gryfem łamanym': [32.5, 10], 'triceps z nad głowy warkoczem': [65, 10]
};
const fmt = (n) => String(n).replace('.', ',');
const chip = (active) => 'flex:none;height:40px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;' +
  (active ? 'border:none;background:#D6D0C0;color:oklch(0.1 0.006 250)' : 'border:1px solid oklch(0.19 0.008 245);background:oklch(0.08 0.005 250);color:oklch(0.7 0.006 240)');

class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const part = s.part || 'Klata';
    const ex = s.ex || 'rozpiętki na bramie góra';
    const prev = POPRZEDNIO[ex];
    const kg = s.kg ?? (prev ? prev[0] : 20);
    const reps = s.reps ?? (prev ? prev[1] + 1 : 10);
    const log = s.log || [[50, 9]];
    const best = prev ? prev[0] * prev[1] : 0;
    const pickEx = (e) => () => { const p = POPRZEDNIO[e]; this.setState({ ex: e, kg: p ? p[0] : 20, reps: p ? p[1] + 1 : 10, log: [] }); };
    const beats = prev && kg * reps > best;
    return {
      parts: Object.keys(PARTIE).map((p) => ({
        name: p, active: p === part, style: chip(p === part),
        dot: 'width:8px;height:8px;border-radius:50%;background:' + (p === part ? 'oklch(0.1 0.006 250)' : PARTIE[p]),
        pick: () => { const e = KATALOG[p][0]; const pr = POPRZEDNIO[e]; this.setState({ part: p, ex: e, kg: pr ? pr[0] : 20, reps: pr ? pr[1] + 1 : 10, log: [] }); }
      })),
      exercises: KATALOG[part].map((e) => ({
        name: e, active: e === ex, pick: pickEx(e),
        prevLabel: POPRZEDNIO[e] ? 'ostatnio ' + fmt(POPRZEDNIO[e][0]) + '×' + POPRZEDNIO[e][1] : 'pierwszy raz',
        prevStyle: 'font-size:12px;color:' + (e === ex ? 'oklch(0.1 0.006 250 / 0.6)' : 'oklch(0.52 0.008 240)'),
        style: 'flex:none;width:150px;min-height:76px;padding:12px 14px;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:left;' +
          (e === ex ? 'border:none;background:#D6D0C0;color:oklch(0.1 0.006 250)' : 'border:1px solid oklch(0.19 0.008 245);background:oklch(0.1 0.006 250);color:oklch(0.85 0.005 240)')
      })),
      partUpper: part.toUpperCase(),
      partDot: 'width:8px;height:8px;border-radius:50%;background:' + PARTIE[part],
      exTitle: ex.charAt(0).toUpperCase() + ex.slice(1),
      hasPrev: !!prev, prevLabel: prev ? fmt(prev[0]) + ' kg × ' + prev[1] : '',
      kgLabel: fmt(kg), reps: reps,
      beatHint: prev ? (beats ? 'Ta seria pobije rekord!' : 'Brakuje ' + Math.ceil((best - kg * reps + 1) / kg) + ' powt. do rekordu') : 'Pierwsza seria ustawi rekord',
      beatColor: beats || !prev ? 'oklch(0.72 0.08 75)' : 'oklch(0.52 0.008 240)',
      kgMinus: () => this.setState({ kg: Math.max(0, kg - 2.5) }),
      kgPlus: () => this.setState({ kg: kg + 2.5 }),
      repMinus: () => this.setState({ reps: Math.max(1, reps - 1) }),
      repPlus: () => this.setState({ reps: reps + 1 }),
      nextNo: log.length + 1,
      logSet: () => this.setState({ log: log.concat([[kg, reps]]) }),
      logEmpty: log.length === 0,
      logCount: log.length + ' Z PLANOWANYCH 3',
      log: log.map((l, i) => {
        const rec = prev ? l[0] * l[1] > best : i === 0;
        const tilt = [-6, 5, -3, 8, -5][i % 5];
        return {
          no: i + 1, label: fmt(l[0]) + ' kg × ' + l[1], record: rec, removeLabel: 'Usuń serię ' + (i + 1),
          remove: () => this.setState({ log: log.filter((_, j) => j !== i) }),
          style: 'display:flex;align-items:center;gap:14px;padding:10px 8px 10px 12px;border-radius:18px;background:oklch(0.1 0.006 250);border:1px solid ' + (rec ? 'oklch(0.72 0.08 75 / 0.45)' : 'oklch(0.19 0.008 245)'),
          stamp: 'width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:Instrument Serif,serif;font-size:20px;transform:rotate(' + tilt + 'deg);' +
            (rec ? 'background:oklch(0.72 0.08 75);color:oklch(0.1 0.006 250)' : 'background:#D6D0C0;color:oklch(0.1 0.006 250)')
        };
      })
    };
  }
}

(function(){
  const props = {};
  const comp = new Component(props);
  const tpl = document.getElementById('dc-tpl');
  const root = document.getElementById('dc-root');
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(path, scope){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((o,k)=> o == null ? undefined : o[k], scope);
  }
  function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
  function proc(node, scope){
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
    if (node.nodeType !== 1) { if (node.nodeType === 8) node.remove(); return; }
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      const list = (m ? look(m[1], scope) : []) || [];
      const as = node.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        Array.from(node.childNodes).forEach(c => { const cl = c.cloneNode(true); const holder = document.createElement('div'); holder.appendChild(cl); proc(cl, s); while (holder.firstChild) frag.appendChild(holder.firstChild); });
      });
      node.replaceWith(frag); return;
    }
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (!(m && look(m[1], scope))) { node.remove(); return; }
      Array.from(node.childNodes).forEach(c => proc(c, scope));
      node.replaceWith(...Array.from(node.childNodes)); return;
    }
    for (const a of Array.from(node.attributes)) {
      if (a.name.startsWith('hint-')) { node.removeAttribute(a.name); continue; }
      if (!a.value.includes('{{')) continue;
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (a.name.startsWith('on') && whole) {
        node.removeAttribute(a.name);
        const fn = look(whole[1], scope);
        if (typeof fn === 'function') node.addEventListener(a.name.slice(2), fn);
        continue;
      }
      node.setAttribute(a.name, interp(a.value, scope));
    }
    Array.from(node.childNodes).forEach(c => proc(c, scope));
  }
  window.__render = function(){
    const saved = {}, ae = document.activeElement, focusId = ae && ae.id;
    let caret = null; try { caret = ae && ae.selectionStart; } catch (e) {}
    root.querySelectorAll('input[id],select[id],textarea[id]').forEach(e => { saved[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
    const frag = tpl.content.cloneNode(true);
    const vals = comp.renderVals();
    Array.from(frag.childNodes).forEach(c => proc(c, vals));
    root.replaceChildren(frag);
    Object.keys(saved).forEach(id => { const e = document.getElementById(id); if (!e || e.hasAttribute('value') && e.type !== 'date') return; if (e.type === 'checkbox') e.checked = saved[id]; else e.value = saved[id]; });
    if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); try { if (caret != null) f.setSelectionRange(caret, caret); } catch (e) {} } }
  };
  __render();
})();

</script>
</body>
</html>
