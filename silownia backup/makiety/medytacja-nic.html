  <p style="margin: 10px 0 0; max-width: 980px; font-size: 14px; line-height: 1.5; color: oklch(0.6 0.008 240)">Nowy znak rozpoznawczy apki: cienka, świecąca nić z kilku pasm. Pokazuje stan: splątana = napięcie, gładka = spokój, napięta i jasna = postęp. Do tego szkło jak w Oszczędnościach. Ostatni ekran pokazuje, jak ten styl wyglądałby na ekranie Dziś. Dane demo.</p>
