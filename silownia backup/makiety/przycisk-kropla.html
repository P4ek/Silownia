<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przycisk menu – kropla</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:oklch(0.07 0.004 250)}

  /* ===== Przycisk menu „kropla” ===== */
  .kropla{
    position:relative;width:56px;height:56px;padding:0;border:none;cursor:pointer;
    background:#D6D0C0;color:oklch(0.1 0.006 250);
    box-shadow:0 14px 30px -14px rgba(214,208,192,0.6);
    animation:kropla 9s ease-in-out infinite;
    transition:transform .35s cubic-bezier(.3,1.5,.5,1);
    -webkit-tap-highlight-color:transparent;
  }
  .kropla:active{transform:scale(.92)}
  .kropla:focus-visible{outline:2px solid #D6D0C0;outline-offset:4px}
  .kropla[aria-expanded="true"]{transform:rotate(90deg)}

  .kropla .l{
    position:absolute;left:18px;top:27px;height:2px;border-radius:2px;background:currentColor;
    transition:transform .45s cubic-bezier(.4,1.6,.5,1),width .3s ease;
  }
  .kropla .l1{width:20px;transform:translateY(-4px)}
  .kropla .l2{width:12px;transform:translateY(4px)}
  .kropla[aria-expanded="true"] .l1{transform:rotate(45deg)}
  .kropla[aria-expanded="true"] .l2{width:20px;transform:rotate(-45deg)}

  @keyframes kropla{
    0%,100%{border-radius:58% 42% 55% 45% / 52% 48% 52% 48%}
    33%{border-radius:45% 55% 40% 60% / 60% 42% 58% 40%}
    66%{border-radius:52% 48% 62% 38% / 45% 58% 42% 55%}
  }
  @media (prefers-reduced-motion: reduce){
    .kropla{animation:none;border-radius:50%}
    .kropla,.kropla .l{transition:none}
  }
</style>
</head>
<body>

<button class="kropla" aria-label="Menu" aria-expanded="false">
  <span class="l l1"></span>
  <span class="l l2"></span>
</button>

<script>
  // Dotknięcie przełącza: kreski ⇄ „X”. W aplikacji tutaj otwierasz/zamykasz menu.
  const kropla = document.querySelector('.kropla');
  kropla.addEventListener('click', () => {
    const otwarte = kropla.getAttribute('aria-expanded') === 'true';
    kropla.setAttribute('aria-expanded', String(!otwarte));
  });
</script>
</body>
</html>
