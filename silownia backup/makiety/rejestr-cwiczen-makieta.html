<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejestr ćwiczeń</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:oklch(0.07 0.004 250)}
a{color:#D6D0C0}a:hover{color:#ffffff}
button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 390px; min-height: 100vh; margin: 0 auto; padding-bottom: 64px; box-sizing: border-box; background: oklch(0.07 0.004 250); color: oklch(0.85 0.005 240); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 64px; overflow: hidden">

  <header style="padding: 56px 24px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Menu" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid oklch(0.19 0.008 245); background: oklch(0.1 0.006 250); color: oklch(0.85 0.005 240); display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <div style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 14px; border: 1px solid oklch(0.19 0.008 245)">
        <button aria-label="Poprzedni trening" style="width: 40px; height: 40px; border: none; border-radius: 10px; background: transparent; color: oklch(0.7 0.006 240); display: grid; place-items: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <span style="font-size: 13px; font-weight: 600; color: oklch(0.85 0.005 240); padding: 0 4px">Czw, 24 wrz</span>
        <button aria-label="Następny trening" style="width: 40px; height: 40px; border: none; border-radius: 10px; background: transparent; color: oklch(0.7 0.006 240); display: grid; place-items: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </div>
    <span style="display: block; margin-top: 30px; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.44 0.008 240)">REJESTR ĆWICZEŃ · OBJĘTOŚĆ TRENINGU</span>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 8px">
      <span style="font-family: 'Instrument Serif', serif; font-size: 104px; line-height: 0.85; letter-spacing: -0.02em; color: oklch(0.95 0.004 240)">{{volume}}</span>
      <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 30px; color: oklch(0.52 0.008 240)">kg</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px">
      <span style="padding: 8px 14px; border-radius: 999px; border: 1px solid oklch(0.19 0.008 245); font-size: 13px; font-weight: 600">6 ćwiczeń</span>
      <span style="padding: 8px 14px; border-radius: 999px; border: 1px solid oklch(0.19 0.008 245); font-size: 13px; font-weight: 600">{{sets}} serii</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: oklch(0.72 0.08 75); color: oklch(0.1 0.006 250); font-size: 13px; font-weight: 700">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg>
        {{records}} rekordy
      </span>
    </div>
  </header>

  <!-- Rozkład serii na partie -->
  <section style="margin: 30px 24px 0">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.52 0.008 240)">ROZKŁAD SERII</span>
    <div style="display: flex; gap: 3px; height: 14px; margin-top: 12px">
      <sc-for list="{{split}}" as="p" hint-placeholder-count="5">
        <div style="{{p.bar}}"></div>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px">
      <sc-for list="{{split}}" as="p" hint-placeholder-count="5">
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: oklch(0.7 0.006 240)">
          <span style="{{p.dot}}"></span>{{p.name}} <b style="color: oklch(0.9 0.004 240)">{{p.n}}</b>
        </span>
      </sc-for>
    </div>
  </section>

  <!-- Ćwiczenia z wykresami podejść -->
  <div style="display: flex; flex-direction: column; gap: 12px; margin: 30px 24px 0">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <article style="{{r.cardStyle}}">
        <div style="display: flex; align-items: flex-start; gap: 14px">
          <span style="font-family: 'Instrument Serif', serif; font-size: 44px; line-height: 0.8; color: oklch(0.3 0.008 245)">{{r.idx}}</span>
          <div style="flex: 1; min-width: 0">
            <span style="display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: oklch(0.6 0.008 240)"><span style="{{r.dot}}"></span>{{r.partUpper}}</span>
            <h3 style="margin: 6px 0 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 24px; line-height: 1.05; color: oklch(0.95 0.004 240)">{{r.name}}</h3>
          </div>
          <sc-if value="{{r.record}}" hint-placeholder-val="{{ false }}">
            <span aria-label="Nowy rekord" style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: oklch(0.72 0.08 75); color: oklch(0.1 0.006 250); display: grid; place-items: center; box-shadow: 0 0 24px oklch(0.72 0.08 75 / 0.5)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg>
            </span>
          </sc-if>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 10px; height: 104px; margin-top: 16px">
          <sc-for list="{{r.sets}}" as="s" hint-placeholder-count="3">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%">
              <span style="{{s.labelStyle}}">{{s.label}}</span>
              <div style="{{s.bar}}"></div>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 10px 0 0; font-size: 12px; color: oklch(0.52 0.008 240)">{{r.note}}</p>
        </sc-if>
      </article>
    </sc-for>
  </div>
</div>
</template>
<script>

class DCLogic { constructor(props){ this.props = props; this.state = {}; } setState(p){ Object.assign(this.state, p); __render(); } forceUpdate(){ __render(); } }

const PARTIE = { Klata: '#D6D0C0', Plecy: 'oklch(0.66 0.13 250)', Barki: 'oklch(0.72 0.14 50)', Biceps: 'oklch(0.66 0.15 300)', Triceps: 'oklch(0.7 0.11 180)' };
const TRENING = [
  { part: 'Klata', name: 'Rozpiętki na bramie – góra', record: true, sets: [[50, 9], [50, 9]] },
  { part: 'Triceps', name: 'Triceps zza głowy z warkoczem', record: true, sets: [[65, 10], [65, 9], [65, 9]] },
  { part: 'Biceps', name: 'Biceps gryfem łamanym', record: false, sets: [[32.5, 10], [32.5, 9], [32.5, 9]] },
  { part: 'Barki', name: 'Wznosy bokiem w oparciu o ławkę', record: true, sets: [[15, 10], [12.5, 13], [12.5, 11]] },
  { part: 'Plecy', name: 'Podciąganie', record: false, added: true, sets: [[7.5, 8], [7.5, 6], [5, 6]] },
  { part: 'Klata', name: 'Rozpiętki na bramie – dół', record: true, sets: [[30, 10], [30, 9]] }
];

class Component extends DCLogic {
  renderVals() {
    const fmt = (n) => String(n).replace('.', ',');
    let sets = 0, volume = 0, records = 0;
    const per = {};
    TRENING.forEach((t) => {
      sets += t.sets.length;
      per[t.part] = (per[t.part] || 0) + t.sets.length;
      if (t.record) records++;
      if (!t.added) t.sets.forEach((s) => { volume += s[0] * s[1]; });
    });
    const split = Object.keys(PARTIE).filter((p) => per[p]).map((p) => ({
      name: p, n: per[p],
      bar: 'flex:' + per[p] + ';border-radius:4px;background:' + PARTIE[p],
      dot: 'width:8px;height:8px;border-radius:50%;background:' + PARTIE[p]
    }));
    const rows = TRENING.map((t, i) => {
      const vols = t.sets.map((s) => s[0] * s[1]);
      const max = Math.max.apply(null, vols);
      return {
        idx: String(i + 1).padStart(2, '0'), name: t.name, partUpper: t.part.toUpperCase(), record: t.record,
        dot: 'width:8px;height:8px;border-radius:50%;background:' + PARTIE[t.part],
        note: t.added ? 'Ciężar to obciążenie dodatkowe do masy ciała' : '',
        cardStyle: 'padding:20px;border-radius:24px;background:oklch(0.1 0.006 250);border:1px solid ' + (t.record ? 'oklch(0.72 0.08 75 / 0.4)' : 'oklch(0.19 0.008 245)'),
        sets: t.sets.map((s, j) => {
          const best = t.record && vols[j] === max && vols.indexOf(max) === j;
          return {
            label: (t.added ? '+' : '') + fmt(s[0]) + '×' + s[1],
            labelStyle: 'font-size:12px;font-weight:700;white-space:nowrap;color:' + (best ? 'oklch(0.72 0.08 75)' : 'oklch(0.7 0.006 240)'),
            bar: 'width:100%;max-width:40px;height:' + Math.round(16 + 60 * vols[j] / max) + 'px;border-radius:10px 10px 4px 4px;background:' + (best ? 'oklch(0.72 0.08 75)' : PARTIE[t.part]) + ';opacity:' + (best ? 1 : 0.85)
          };
        })
      };
    });
    return { volume: volume.toLocaleString('pl-PL'), sets: sets, records: records, split: split, rows: rows };
  }
}

(function(){
  const props = {};
  const comp = new Component(props);
  const tpl = document.getElementById('dc-tpl');
  const root = document.getElementById('dc-root');
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(path, scope){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((o,k)=> o == null ? undefined : o[k], scope);
  }
  function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
  function proc(node, scope){
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
    if (node.nodeType !== 1) { if (node.nodeType === 8) node.remove(); return; }
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      const list = (m ? look(m[1], scope) : []) || [];
      const as = node.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        Array.from(node.childNodes).forEach(c => { const cl = c.cloneNode(true); const holder = document.createElement('div'); holder.appendChild(cl); proc(cl, s); while (holder.firstChild) frag.appendChild(holder.firstChild); });
      });
      node.replaceWith(frag); return;
    }
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (!(m && look(m[1], scope))) { node.remove(); return; }
      Array.from(node.childNodes).forEach(c => proc(c, scope));
      node.replaceWith(...Array.from(node.childNodes)); return;
    }
    for (const a of Array.from(node.attributes)) {
      if (a.name.startsWith('hint-')) { node.removeAttribute(a.name); continue; }
      if (!a.value.includes('{{')) continue;
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (a.name.startsWith('on') && whole) {
        node.removeAttribute(a.name);
        const fn = look(whole[1], scope);
        if (typeof fn === 'function') node.addEventListener(a.name.slice(2), fn);
        continue;
      }
      node.setAttribute(a.name, interp(a.value, scope));
    }
    Array.from(node.childNodes).forEach(c => proc(c, scope));
  }
  window.__render = function(){
    const saved = {}, ae = document.activeElement, focusId = ae && ae.id;
    let caret = null; try { caret = ae && ae.selectionStart; } catch (e) {}
    root.querySelectorAll('input[id],select[id],textarea[id]').forEach(e => { saved[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
    const frag = tpl.content.cloneNode(true);
    const vals = comp.renderVals();
    Array.from(frag.childNodes).forEach(c => proc(c, vals));
    root.replaceChildren(frag);
    Object.keys(saved).forEach(id => { const e = document.getElementById(id); if (!e || e.hasAttribute('value') && e.type !== 'date') return; if (e.type === 'checkbox') e.checked = saved[id]; else e.value = saved[id]; });
    if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); try { if (caret != null) f.setSelectionRange(caret, caret); } catch (e) {} } }
  };
  __render();
})();

</script>
</body>
</html>
