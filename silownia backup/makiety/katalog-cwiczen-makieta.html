<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog ćwiczeń</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:oklch(0.07 0.004 250)}
a{color:#D6D0C0}a:hover{color:#ffffff}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:oklch(0.44 0.008 240)}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 390px; min-height: 100vh; margin: 0 auto; padding-bottom: 64px; box-sizing: border-box; background: oklch(0.07 0.004 250); color: oklch(0.85 0.005 240); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 64px; overflow: hidden">

  <header style="padding: 56px 24px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Menu" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid oklch(0.19 0.008 245); background: oklch(0.1 0.006 250); color: oklch(0.85 0.005 240); display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.44 0.008 240)">KATALOG ĆWICZEŃ</span>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 14px; margin-top: 22px">
      <span style="font-family: 'Instrument Serif', serif; font-size: 120px; line-height: 0.8; letter-spacing: -0.03em; color: oklch(0.95 0.004 240)">{{total}}</span>
      <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 30px; line-height: 1.05; color: oklch(0.6 0.008 240); padding-bottom: 6px">ćwiczeń<br>w Twojej bazie</span>
    </div>
  </header>

  <!-- Kafle partii -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 30px 24px 0">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="5">
      <button onClick="{{t.pick}}" aria-pressed="{{t.active}}" style="{{t.style}}">
        <span style="{{t.orb}}"></span>
        <span style="position: relative; font-family: 'Instrument Serif', serif; font-size: 58px; line-height: 0.9">{{t.count}}</span>
        <span style="position: relative; font-size: 15px; font-weight: 700">{{t.name}}</span>
      </button>
    </sc-for>
    <button onClick="{{openForm}}" aria-expanded="{{formOpen}}" style="min-height: 136px; border-radius: 24px; border: 1.5px dashed oklch(0.3 0.008 245); background: transparent; color: oklch(0.7 0.006 240); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 14px; font-weight: 600">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #D6D0C0; color: oklch(0.1 0.006 250); display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
      Nowe ćwiczenie
    </button>
  </div>

  <sc-if value="{{formOpen}}" hint-placeholder-val="{{ false }}">
    <section style="margin: 12px 24px 0; padding: 18px; border-radius: 24px; background: oklch(0.1 0.006 250); border: 1px solid #D6D0C0">
      <label for="nazwa-b" style="display: block; font-size: 13px; font-weight: 600; color: oklch(0.6 0.008 240)">Nowe ćwiczenie w partii: <b style="color: oklch(0.93 0.004 240)">{{part}}</b></label>
      <div style="display: flex; gap: 8px; margin-top: 10px">
        <input id="nazwa-b" value="{{draft}}" onInput="{{onDraft}}" placeholder="np. przysiad ze sztangą" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid oklch(0.19 0.008 245); background: oklch(0.08 0.005 250); color: oklch(0.9 0.004 240); font-size: 15px">
        <button onClick="{{save}}" style="height: 48px; padding: 0 18px; border-radius: 14px; border: none; background: #D6D0C0; color: oklch(0.1 0.006 250); font-size: 14px; font-weight: 700">Zapisz</button>
      </div>
    </section>
  </sc-if>

  <!-- Lista wybranej partii -->
  <div style="display: flex; align-items: baseline; gap: 12px; padding: 36px 24px 0">
    <span style="{{bigDot}}"></span>
    <h2 style="margin: 0; flex: 1; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 40px; line-height: 1; color: oklch(0.95 0.004 240)">{{part}}</h2>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: oklch(0.44 0.008 240)">{{countLabel}}</span>
  </div>
  <ol style="list-style: none; margin: 16px 24px 0; padding: 0">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <li style="display: flex; align-items: center; gap: 16px; min-height: 64px; border-top: 1px solid oklch(0.16 0.007 248)">
        <span style="width: 34px; font-family: 'Instrument Serif', serif; font-size: 26px; color: oklch(0.3 0.008 245)">{{it.n}}</span>
        <span style="flex: 1; font-size: 16px; font-weight: 500; color: oklch(0.9 0.004 240)">{{it.name}}</span>
        <button onClick="{{it.remove}}" aria-label="{{it.removeLabel}}" style="width: 44px; height: 44px; flex: none; border-radius: 12px; border: none; background: transparent; color: oklch(0.44 0.008 240); display: grid; place-items: center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
        </button>
      </li>
    </sc-for>
  </ol>
</div>
</template>
<script>

class DCLogic { constructor(props){ this.props = props; this.state = {}; } setState(p){ Object.assign(this.state, p); __render(); } forceUpdate(){ __render(); } }

const PARTIE = { Klata: '#D6D0C0', Plecy: 'oklch(0.66 0.13 250)', Barki: 'oklch(0.72 0.14 50)', Biceps: 'oklch(0.66 0.15 300)', Triceps: 'oklch(0.7 0.11 180)' };
const START = {
  Klata: ['rozpiętki hantlami', 'rozpiętki na bramie dół', 'rozpiętki na bramie góra', 'wyciskanie hantlami ławka płaska', 'wyciskanie hantli ławka skośna', 'wyciskanie na maszynie'],
  Plecy: ['podciąganie', 'wiosłowanie na maszynie wąsko'],
  Barki: ['wznosy bokiem w oparciu o ławkę'],
  Biceps: ['biceps gryfem łamanym'],
  Triceps: ['triceps z nad głowy warkoczem']
};

class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const cat = s.cat || START;
    const part = s.part || 'Klata';
    let total = 0;
    Object.keys(cat).forEach((p) => { total += cat[p].length; });
    const list = cat[part] || [];
    const n = list.length;
    return {
      total: total, part: part, formOpen: !!s.form, draft: s.draft || '',
      countLabel: n === 1 ? '1 ĆWICZENIE' : (n >= 2 && n <= 4 ? n + ' ĆWICZENIA' : n + ' ĆWICZEŃ'),
      bigDot: 'width:14px;height:14px;border-radius:50%;flex:none;align-self:center;background:' + PARTIE[part] + ';box-shadow:0 0 18px ' + PARTIE[part],
      tiles: Object.keys(PARTIE).map((p) => {
        const active = p === part;
        return {
          name: p, count: (cat[p] || []).length, active: active,
          pick: () => this.setState({ part: p }),
          style: 'position:relative;overflow:hidden;min-height:136px;padding:16px;border-radius:24px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;text-align:left;' +
            (active ? 'border:1px solid ' + PARTIE[p] + ';background:oklch(0.12 0.008 248);color:oklch(0.95 0.004 240)' : 'border:1px solid oklch(0.19 0.008 245);background:oklch(0.1 0.006 250);color:oklch(0.8 0.005 240)'),
          orb: 'position:absolute;right:-34px;top:-34px;width:110px;height:110px;border-radius:50%;background:' + PARTIE[p] + ';opacity:' + (active ? 0.9 : 0.22)
        };
      }),
      items: list.map((e, i) => ({
        n: String(i + 1).padStart(2, '0'), name: e, removeLabel: 'Usuń ' + e,
        remove: () => { const next = Object.assign({}, cat); next[part] = list.filter((x) => x !== e); this.setState({ cat: next }); }
      })),
      openForm: () => this.setState({ form: !s.form }),
      onDraft: (e) => this.setState({ draft: e.target.value }),
      save: () => {
        const name = ((this.state && this.state.draft) || '').trim();
        if (!name) return;
        const next = Object.assign({}, cat);
        next[part] = list.concat([name]);
        this.setState({ cat: next, draft: '', form: false });
      }
    };
  }
}

(function(){
  const props = {};
  const comp = new Component(props);
  const tpl = document.getElementById('dc-tpl');
  const root = document.getElementById('dc-root');
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(path, scope){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((o,k)=> o == null ? undefined : o[k], scope);
  }
  function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
  function proc(node, scope){
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
    if (node.nodeType !== 1) { if (node.nodeType === 8) node.remove(); return; }
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      const list = (m ? look(m[1], scope) : []) || [];
      const as = node.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        Array.from(node.childNodes).forEach(c => { const cl = c.cloneNode(true); const holder = document.createElement('div'); holder.appendChild(cl); proc(cl, s); while (holder.firstChild) frag.appendChild(holder.firstChild); });
      });
      node.replaceWith(frag); return;
    }
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (!(m && look(m[1], scope))) { node.remove(); return; }
      Array.from(node.childNodes).forEach(c => proc(c, scope));
      node.replaceWith(...Array.from(node.childNodes)); return;
    }
    for (const a of Array.from(node.attributes)) {
      if (a.name.startsWith('hint-')) { node.removeAttribute(a.name); continue; }
      if (!a.value.includes('{{')) continue;
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (a.name.startsWith('on') && whole) {
        node.removeAttribute(a.name);
        const fn = look(whole[1], scope);
        if (typeof fn === 'function') node.addEventListener(a.name.slice(2), fn);
        continue;
      }
      node.setAttribute(a.name, interp(a.value, scope));
    }
    Array.from(node.childNodes).forEach(c => proc(c, scope));
  }
  window.__render = function(){
    const saved = {}, ae = document.activeElement, focusId = ae && ae.id;
    let caret = null; try { caret = ae && ae.selectionStart; } catch (e) {}
    root.querySelectorAll('input[id],select[id],textarea[id]').forEach(e => { saved[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
    const frag = tpl.content.cloneNode(true);
    const vals = comp.renderVals();
    Array.from(frag.childNodes).forEach(c => proc(c, vals));
    root.replaceChildren(frag);
    Object.keys(saved).forEach(id => { const e = document.getElementById(id); if (!e || e.hasAttribute('value') && e.type !== 'date') return; if (e.type === 'checkbox') e.checked = saved[id]; else e.value = saved[id]; });
    if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); try { if (caret != null) f.setSelectionRange(caret, caret); } catch (e) {} } }
  };
  __render();
})();

</script>
</body>
</html>
