<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaplanuj trening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:oklch(0.07 0.004 250)}
a{color:#D6D0C0}a:hover{color:#ffffff}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:oklch(0.5 0.008 240)}
.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 390px; min-height: 100vh; margin: 0 auto; padding-bottom: 64px; box-sizing: border-box; background: oklch(0.07 0.004 250); color: oklch(0.85 0.005 240); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 64px; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 56px 24px 0">
    <button aria-label="Menu" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid oklch(0.19 0.008 245); background: oklch(0.1 0.006 250); color: oklch(0.85 0.005 240); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.44 0.008 240)">ZAPLANUJ TRENING</span>
  </header>

  <!-- Okładka planu -->
  <section style="position: relative; margin: 24px 24px 0; height: 300px; border-radius: 28px; background: oklch(0.1 0.006 250); border: 1px solid oklch(0.19 0.008 245); overflow: hidden">
    <sc-for list="{{art}}" as="a" hint-placeholder-count="3">
      <span style="{{a.style}}"></span>
    </sc-for>
    <div style="position: absolute; inset: auto 0 0 0; padding: 60px 20px 18px; background: linear-gradient(to top, oklch(0.1 0.006 250) 45%, transparent)">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.6 0.008 240)">NOWY PLAN · {{planCount}}</span>
      <label for="nazwa-p" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nazwa planu</label>
      <input id="nazwa-p" placeholder="Nazwij plan…" style="display: block; width: 100%; margin-top: 4px; padding: 0; border: none; background: transparent; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 44px; line-height: 1.1; color: oklch(0.95 0.004 240); outline: none">
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.008 240)" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
        <span style="font-size: 13px; color: oklch(0.6 0.008 240)">Niedziela, 4 października</span>
      </div>
    </div>
  </section>

  <!-- Lista utworów -->
  <ol style="list-style: none; margin: 18px 24px 0; padding: 0">
    <sc-for list="{{plan}}" as="it" hint-placeholder-count="2">
      <li style="display: flex; align-items: center; gap: 14px; min-height: 60px; border-bottom: 1px solid oklch(0.16 0.007 248)">
        <span style="width: 30px; font-family: 'Instrument Serif', serif; font-size: 24px; color: oklch(0.44 0.008 240)">{{it.n}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 15px; font-weight: 600; color: oklch(0.93 0.004 240)">{{it.name}}</span>
          <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: oklch(0.52 0.008 240)"><span style="{{it.dot}}"></span>{{it.part}}</span>
        </span>
        <button onClick="{{it.remove}}" aria-label="{{it.removeLabel}}" style="width: 44px; height: 44px; flex: none; border: none; border-radius: 12px; background: transparent; color: oklch(0.44 0.008 240); display: grid; place-items: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </li>
    </sc-for>
  </ol>
  <sc-if value="{{planEmpty}}" hint-placeholder-val="{{ false }}">
    <p style="margin: 0 24px; padding: 18px 0; font-size: 14px; color: oklch(0.52 0.008 240)">Pusta playlista – dodaj ćwiczenia poniżej.</p>
  </sc-if>

  <!-- Dodawanie -->
  <span style="display: block; margin: 26px 24px 0; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.52 0.008 240)">DODAJ DO PLANU</span>
  <div class="chips" style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 24px 0">
    <sc-for list="{{parts}}" as="p" hint-placeholder-count="5">
      <button onClick="{{p.pick}}" aria-pressed="{{p.active}}" style="{{p.style}}"><span style="{{p.dot}}"></span>{{p.name}}</button>
    </sc-for>
    <div style="flex: none; width: 8px"></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; margin: 12px 24px 0">
    <sc-for list="{{exercises}}" as="e" hint-placeholder-count="4">
      <button onClick="{{e.add}}" aria-pressed="{{e.inPlan}}" style="{{e.style}}">
        <span style="flex: 1">{{e.name}}</span>
        <span style="{{e.badge}}">{{e.badgeText}}</span>
      </button>
    </sc-for>
  </div>

  <button onClick="{{toggleNotion}}" role="switch" aria-checked="{{notion}}" style="margin: 20px 24px 0; width: 342px; min-height: 56px; padding: 0 16px; border-radius: 18px; border: 1px solid oklch(0.19 0.008 245); background: oklch(0.1 0.006 250); display: flex; align-items: center; gap: 12px; color: oklch(0.85 0.005 240); text-align: left">
    <span style="width: 30px; height: 30px; flex: none; border-radius: 8px; border: 1px solid oklch(0.26 0.008 245); display: grid; place-items: center; font-family: 'Instrument Serif', serif; font-size: 17px">N</span>
    <span style="flex: 1; font-size: 15px; font-weight: 600">Wyślij też do Notion</span>
    <span style="{{trackStyle}}"><span style="{{knobStyle}}"></span></span>
  </button>
  <button style="margin: 12px 24px 0; width: 342px; height: 60px; border-radius: 999px; border: none; background: #D6D0C0; color: oklch(0.1 0.006 250); font-size: 16px; font-weight: 700; box-shadow: 0 18px 40px -16px rgba(214,208,192,0.6)">Zapisz plan</button>

  <!-- Zapisane plany jak albumy -->
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 40px 24px 0">
    <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 30px; color: oklch(0.85 0.005 240)">Twoje plany</h2>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: oklch(0.44 0.008 240)">1 ZAPISANY</span>
  </div>
  <div class="chips" style="display: flex; gap: 12px; overflow-x: auto; padding: 14px 24px 0">
    <article style="position: relative; flex: none; width: 220px; border-radius: 24px; background: oklch(0.1 0.006 250); border: 1px solid oklch(0.19 0.008 245); overflow: hidden">
      <div style="position: relative; height: 150px; overflow: hidden">
        <sc-for list="{{savedArt}}" as="a" hint-placeholder-count="5">
          <span style="{{a.style}}"></span>
        </sc-for>
      </div>
      <div style="padding: 14px 16px 16px">
        <h3 style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 30px; line-height: 1; color: oklch(0.95 0.004 240)">FBW 1</h3>
        <span style="display: block; margin-top: 4px; font-size: 12px; color: oklch(0.52 0.008 240)">5 ćwiczeń · 5 partii</span>
        <div style="display: flex; gap: 8px; margin-top: 14px">
          <button style="flex: 1; height: 44px; border-radius: 14px; border: 1px solid oklch(0.26 0.008 245); background: transparent; color: oklch(0.85 0.005 240); font-size: 13px; font-weight: 600">Notion</button>
          <button aria-label="Usuń plan FBW 1" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid oklch(0.26 0.008 245); background: transparent; color: oklch(0.52 0.008 240); display: grid; place-items: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
          </button>
        </div>
      </div>
      <button aria-label="Rozpocznij plan FBW 1" style="position: absolute; right: 14px; top: 124px; width: 56px; height: 56px; border-radius: 50%; border: none; background: #D6D0C0; color: oklch(0.1 0.006 250); display: grid; place-items: center; box-shadow: 0 10px 24px -6px rgba(0,0,0,0.8)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
      </button>
    </article>
    <div style="flex: none; width: 140px; border-radius: 24px; border: 1.5px dashed oklch(0.19 0.008 245); display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font-size: 13px; color: oklch(0.44 0.008 240)">Tu pojawi się Twój kolejny plan</div>
    <div style="flex: none; width: 8px"></div>
  </div>
</div>
</template>
<script>

class DCLogic { constructor(props){ this.props = props; this.state = {}; } setState(p){ Object.assign(this.state, p); __render(); } forceUpdate(){ __render(); } }

const PARTIE = { Klata: '#D6D0C0', Plecy: 'oklch(0.66 0.13 250)', Barki: 'oklch(0.72 0.14 50)', Biceps: 'oklch(0.66 0.15 300)', Triceps: 'oklch(0.7 0.11 180)' };
const KATALOG = {
  Klata: ['rozpiętki hantlami', 'rozpiętki na bramie dół', 'rozpiętki na bramie góra', 'wyciskanie hantlami ławka płaska', 'wyciskanie hantli ławka skośna', 'wyciskanie na maszynie'],
  Plecy: ['podciąganie', 'wiosłowanie na maszynie wąsko'],
  Barki: ['wznosy bokiem w oparciu o ławkę'],
  Biceps: ['biceps gryfem łamanym'],
  Triceps: ['triceps z nad głowy warkoczem']
};
const FBW1 = [['Klata', 'rozpiętki na bramie góra'], ['Klata', 'rozpiętki na bramie dół'], ['Plecy', 'podciąganie'], ['Barki', 'wznosy bokiem w oparciu o ławkę'], ['Biceps', 'biceps gryfem łamanym']];
const START = [['Plecy', 'wiosłowanie na maszynie wąsko'], ['Klata', 'wyciskanie hantlami ławka płaska'], ['Triceps', 'triceps z nad głowy warkoczem']];
const chip = (active) => 'flex:none;height:40px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;' +
  (active ? 'border:none;background:#D6D0C0;color:oklch(0.1 0.006 250)' : 'border:1px solid oklch(0.19 0.008 245);background:oklch(0.08 0.005 250);color:oklch(0.7 0.006 240)');
// okładka: koło na każde ćwiczenie, w kolorze partii
function cover(items, w, h, scale) {
  if (!items.length) return [{ style: 'position:absolute;left:' + (w / 2 - 50) + 'px;top:' + (h / 2 - 80) + 'px;width:100px;height:100px;border-radius:50%;border:1.5px dashed oklch(0.3 0.008 245)' }];
  return items.map((it, i) => {
    const size = Math.round((150 - (i % 3) * 34) * scale);
    const x = Math.round(((i * 97 + 20) % (w - 40)) - size / 3);
    const y = Math.round(((i * 53 + 10) % Math.max(40, h - 120)) - size / 4);
    return { style: 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + PARTIE[it[0]] + ';opacity:0.85;mix-blend-mode:screen' };
  });
}

class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const part = s.part || 'Klata';
    const plan = s.plan || START;
    const notion = !!s.notion;
    const has = (e) => plan.some((x) => x[1] === e);
    const n = plan.length;
    return {
      notion: notion,
      art: cover(plan, 342, 300, 1),
      savedArt: cover(FBW1, 220, 150, 0.6),
      planEmpty: n === 0,
      planCount: (n === 1 ? '1 ĆWICZENIE' : (n >= 2 && n <= 4 ? n + ' ĆWICZENIA' : n + ' ĆWICZEŃ')),
      plan: plan.map((x, i) => ({
        n: String(i + 1).padStart(2, '0'), name: x[1], part: x[0].toUpperCase(),
        dot: 'width:7px;height:7px;border-radius:50%;background:' + PARTIE[x[0]],
        removeLabel: 'Usuń ' + x[1] + ' z planu',
        remove: () => this.setState({ plan: plan.filter((_, j) => j !== i) })
      })),
      parts: Object.keys(PARTIE).map((p) => ({
        name: p, active: p === part, style: chip(p === part),
        dot: 'width:8px;height:8px;border-radius:50%;background:' + (p === part ? 'oklch(0.1 0.006 250)' : PARTIE[p]),
        pick: () => this.setState({ part: p })
      })),
      exercises: KATALOG[part].map((e) => ({
        name: e, inPlan: has(e), badgeText: has(e) ? 'w planie' : '+ dodaj',
        badge: 'font-size:12px;font-weight:700;white-space:nowrap;color:' + (has(e) ? 'oklch(0.72 0.08 75)' : 'oklch(0.7 0.006 240)'),
        style: 'min-height:52px;padding:0 16px;border-radius:16px;display:flex;align-items:center;gap:12px;text-align:left;font-size:15px;' +
          (has(e) ? 'border:1px solid oklch(0.72 0.08 75 / 0.45);background:oklch(0.12 0.015 75);color:oklch(0.95 0.004 240)' : 'border:1px solid oklch(0.19 0.008 245);background:oklch(0.1 0.006 250);color:oklch(0.85 0.005 240)'),
        add: () => this.setState({ plan: has(e) ? plan.filter((x) => x[1] !== e) : plan.concat([[part, e]]) })
      })),
      toggleNotion: () => this.setState({ notion: !notion }),
      trackStyle: 'width:48px;height:28px;flex:none;border-radius:999px;position:relative;background:' + (notion ? '#D6D0C0' : 'oklch(0.19 0.008 245)'),
      knobStyle: 'position:absolute;top:3px;left:' + (notion ? 23 : 3) + 'px;width:22px;height:22px;border-radius:50%;transition:left .2s;background:' + (notion ? 'oklch(0.1 0.006 250)' : 'oklch(0.6 0.008 240)')
    };
  }
}

(function(){
  const props = {};
  const comp = new Component(props);
  const tpl = document.getElementById('dc-tpl');
  const root = document.getElementById('dc-root');
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(path, scope){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((o,k)=> o == null ? undefined : o[k], scope);
  }
  function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
  function proc(node, scope){
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
    if (node.nodeType !== 1) { if (node.nodeType === 8) node.remove(); return; }
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      const list = (m ? look(m[1], scope) : []) || [];
      const as = node.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        Array.from(node.childNodes).forEach(c => { const cl = c.cloneNode(true); const holder = document.createElement('div'); holder.appendChild(cl); proc(cl, s); while (holder.firstChild) frag.appendChild(holder.firstChild); });
      });
      node.replaceWith(frag); return;
    }
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (!(m && look(m[1], scope))) { node.remove(); return; }
      Array.from(node.childNodes).forEach(c => proc(c, scope));
      node.replaceWith(...Array.from(node.childNodes)); return;
    }
    for (const a of Array.from(node.attributes)) {
      if (a.name.startsWith('hint-')) { node.removeAttribute(a.name); continue; }
      if (!a.value.includes('{{')) continue;
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (a.name.startsWith('on') && whole) {
        node.removeAttribute(a.name);
        const fn = look(whole[1], scope);
        if (typeof fn === 'function') node.addEventListener(a.name.slice(2), fn);
        continue;
      }
      node.setAttribute(a.name, interp(a.value, scope));
    }
    Array.from(node.childNodes).forEach(c => proc(c, scope));
  }
  window.__render = function(){
    const saved = {}, ae = document.activeElement, focusId = ae && ae.id;
    let caret = null; try { caret = ae && ae.selectionStart; } catch (e) {}
    root.querySelectorAll('input[id],select[id],textarea[id]').forEach(e => { saved[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
    const frag = tpl.content.cloneNode(true);
    const vals = comp.renderVals();
    Array.from(frag.childNodes).forEach(c => proc(c, vals));
    root.replaceChildren(frag);
    Object.keys(saved).forEach(id => { const e = document.getElementById(id); if (!e || e.hasAttribute('value') && e.type !== 'date') return; if (e.type === 'checkbox') e.checked = saved[id]; else e.value = saved[id]; });
    if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); try { if (caret != null) f.setSelectionRange(caret, caret); } catch (e) {} } }
  };
  __render();
})();

</script>
</body>
</html>
