<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dziś – niebo dnia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:oklch(0.07 0.004 250)}
a{color:#D6D0C0;text-decoration:none}a:hover{color:#ffffff}
button{font-family:inherit;cursor:pointer}
.press{transition:transform .2s cubic-bezier(.3,1.5,.5,1)}.press:active{transform:scale(.97)}
.mdrop{animation:mdrop 9s ease-in-out infinite;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}.mdrop:active{transform:scale(.92)}@keyframes mdrop{0%,100%{border-radius:58% 42% 55% 45% / 52% 48% 52% 48%}33%{border-radius:45% 55% 40% 60% / 60% 42% 58% 40%}66%{border-radius:52% 48% 62% 38% / 45% 58% 42% 55%}}@media (prefers-reduced-motion: reduce){.mdrop{animation:none;border-radius:50%}}
.drift{animation:drift 16s ease-in-out infinite}@keyframes drift{0%,100%{transform:translate(0,0)}33%{transform:translate(3px,-4px)}66%{transform:translate(-3px,2px)}}
.orbit{transform-origin:171px 160px;animation:orbit 90s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}
.twinkle{animation:tw 3.6s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}
.lit{filter:drop-shadow(0 0 6px rgba(214,208,192,0.9)) drop-shadow(0 0 14px rgba(214,208,192,0.35));transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.born{animation:born .7s cubic-bezier(.3,1.6,.5,1) both,breathe 4s ease-in-out .7s infinite}@keyframes born{from{transform:scale(0) rotate(-90deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.drift,.orbit,.twinkle,.lit,.born{animation:none}}
.unfold{animation:unfold .35s cubic-bezier(.3,1,.4,1) both}@keyframes unfold{from{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){.unfold{animation:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 390px; min-height: 100vh; margin: 0 auto; padding-bottom: 64px; box-sizing: border-box; background: oklch(0.07 0.004 250); color: oklch(0.85 0.005 240); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 64px; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 56px 24px 0">
    <button aria-label="Menu" class="mdrop" style="position: relative; width: 56px; height: 56px; flex: none; padding: 0; border: none; background: #D6D0C0; color: oklch(0.1 0.006 250); box-shadow: 0 14px 30px -14px rgba(214,208,192,0.6)"><span style="position:absolute;left:18px;top:23px;width:20px;height:2px;border-radius:2px;background:currentColor"></span><span style="position:absolute;left:18px;top:31px;width:12px;height:2px;border-radius:2px;background:currentColor"></span></button>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.44 0.008 240)">PONIEDZIAŁEK · 5 PAŹ</span>
  </header>

  <!-- Powitanie -->
  <h1 style="margin: 26px 24px 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 36px; line-height: 1; color: oklch(0.93 0.004 240)">Dobry wieczór, Andrzej.</h1>

  <!-- Niebo dnia: każda zrobiona rzecz zapala gwiazdę -->
  <section style="position: relative; margin: 18px 0 0">
    <div style="position: absolute; left: 50%; top: 40%; width: 420px; height: 420px; transform: translate(-50%, -50%); background: radial-gradient(circle, oklch(0.72 0.08 75 / 0.10), transparent 60%); pointer-events: none"></div>
    <div style="position: relative; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 24px">
      <span style="display: flex; align-items: flex-start; color: oklch(0.97 0.004 240)">
        <span style="font-family: 'Instrument Serif', serif; font-size: 96px; line-height: 0.82; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">{{score}}</span>
        <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 30px; color: #D6D0C0">%</span>
      </span>
      <span style="padding-bottom: 6px; text-align: right; font-size: 13px; line-height: 1.4; color: oklch(0.6 0.008 240)">dnia za Tobą<br><span style="color: #D6D0C0">{{lit}} z {{totalStars}} gwiazd</span></span>
    </div>
    <div class="drift" style="position: relative; width: 342px; height: 300px; margin: 6px auto 0">
      <svg width="342" height="300" viewBox="0 0 342 300" style="position: absolute; inset: 0; overflow: visible" aria-hidden="true">
        <circle class="orbit" cx="171" cy="160" r="150" fill="none" stroke="oklch(0.72 0.08 75 / 0.18)" stroke-width="1" stroke-dasharray="2 7"></circle>
        <circle cx="171" cy="160" r="104" fill="none" stroke="oklch(0.3 0.008 245 / 0.35)" stroke-width="1"></circle>
        <sc-for list="{{dust}}" as="d" hint-placeholder-count="20">
          <circle class="twinkle" cx="{{d.x}}" cy="{{d.y}}" r="{{d.r}}" fill="oklch(0.85 0.005 240)" style="{{d.st}}"></circle>
        </sc-for>
        <sc-for list="{{links}}" as="l" hint-placeholder-count="9">
          <line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-dasharray="{{l.dash}}" stroke-linecap="round"></line>
        </sc-for>
        <sc-for list="{{stars}}" as="st" hint-placeholder-count="9">
          <g>
            <circle cx="{{st.x}}" cy="{{st.y}}" r="{{st.halo}}" fill="{{st.c}}" opacity="{{st.haloOp}}"></circle>
            <path d="{{st.shape}}" fill="{{st.fill}}" stroke="{{st.ring}}" stroke-width="1.2" class="{{st.cls}}"></path>
            <text x="{{st.lx}}" y="{{st.ly}}" text-anchor="{{st.anchor}}" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="{{st.lc}}">{{st.name}}</text>
          </g>
        </sc-for>
      </svg>
      <sc-for list="{{stars}}" as="st" hint-placeholder-count="9">
        <button onClick="{{st.toggle}}" aria-pressed="{{st.on}}" aria-label="{{st.aria}}" style="{{st.hit}}"></button>
      </sc-for>
    </div>
    <p style="margin: 2px 24px 0; text-align: center; font-size: 13px; color: oklch(0.5 0.008 240)">{{skyHint}}</p>
  </section>

  <!-- Cztery części dnia – wszystko na widoku -->
  <div style="margin: 26px 24px 0; border-top: 1px solid oklch(0.72 0.08 75 / 0.22)">

    <div style="border-bottom: 1px solid oklch(0.16 0.007 248)">
      <div style="{{rowStyle}}">
        <svg width="22" height="22" viewBox="0 0 30 30" aria-hidden="true" style="{{gT.glow}}"><path d="{{gT.star}}" fill="{{gT.fill}}" stroke="{{gT.c}}" stroke-width="1.5"></path></svg>
        <span style="flex: 1; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 27px; line-height: 1; color: oklch(0.95 0.004 240)">Trening</span>
        <span style="{{gT.valStyle}}">{{gT.value}}</span>
      </div>
        <div style="padding: 0 0 18px 36px">
          <span style="display: block; font-size: 13px; color: oklch(0.6 0.008 240)">FBW 1, całe ciało. {{trainingSub}}</span>
          <div style="display: flex; flex-direction: column; margin-top: 6px">
            <sc-for list="{{exercises}}" as="e" hint-placeholder-count="5">
              <span style="display: flex; align-items: baseline; gap: 8px; padding: 4px 0; font-size: 14px; color: oklch(0.85 0.005 240)">{{e.n}}<span style="flex: 1; border-bottom: 1px dotted oklch(0.26 0.008 245); transform: translateY(-4px)"></span><span style="font-variant-numeric: tabular-nums; color: oklch(0.6 0.008 240)">{{e.w}}</span></span>
            </sc-for>
            <span style="padding-top: 2px; font-size: 12px; color: oklch(0.5 0.008 240)">+2 ćwiczenia</span>
          </div>
          <button onClick="{{toggleTraining}}" aria-pressed="{{trained}}" class="press" style="{{trainingBtn}}">{{trainingLabel}}</button>
        </div>
    </div>

    <div style="border-bottom: 1px solid oklch(0.16 0.007 248)">
      <div style="{{rowStyle}}">
        <svg width="22" height="22" viewBox="0 0 30 30" aria-hidden="true" style="{{gH.glow}}"><path d="{{gH.star}}" fill="{{gH.fill}}" stroke="{{gH.c}}" stroke-width="1.5"></path></svg>
        <span style="flex: 1; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 27px; line-height: 1; color: oklch(0.95 0.004 240)">Nawyki</span>
        <span style="{{gH.valStyle}}">{{gH.value}}</span>
      </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 14px; padding: 0 0 12px 36px">
          <sc-for list="{{habits}}" as="h" hint-placeholder-count="4">
            <button onClick="{{h.toggle}}" aria-pressed="{{h.on}}" style="{{h.style}}">
              <span style="{{h.nameStyle}}">{{h.name}}</span>
              <svg width="18" height="18" viewBox="0 0 30 30" aria-hidden="true" style="{{h.glow}}"><path d="{{h.star}}" fill="{{h.fill}}" stroke="#D6D0C0" stroke-width="1.5"></path></svg>
            </button>
          </sc-for>
        </div>
    </div>

    <div style="border-bottom: 1px solid oklch(0.16 0.007 248)">
      <div style="{{rowStyle}}">
        <svg width="22" height="22" viewBox="0 0 30 30" aria-hidden="true" style="{{gM.glow}}"><path d="{{gM.star}}" fill="{{gM.fill}}" stroke="{{gM.c}}" stroke-width="1.5"></path></svg>
        <span style="flex: 1; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 27px; line-height: 1; color: oklch(0.95 0.004 240)">Posiłki</span>
        <span style="{{gM.valStyle}}">{{gM.value}}</span>
      </div>
        <div style="padding: 0 0 18px 36px">
          <div style="display: flex; align-items: baseline; gap: 6px">
            <span style="font-family: 'Instrument Serif', serif; font-size: 30px; line-height: 1; color: oklch(0.97 0.004 240)">{{kcal}}</span>
            <span style="font-size: 13px; color: oklch(0.55 0.008 240)">z 2600 kcal</span>
          </div>
          <span style="display: block; height: 2px; margin-top: 10px; background: oklch(0.18 0.007 248)"><span style="{{kcalBar}}"></span></span>
          <div style="display: flex; gap: 22px; margin-top: 12px">
            <sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
              <span style="font-size: 13px; color: oklch(0.55 0.008 240)">{{m.k}} <span style="font-weight: 700; color: oklch(0.88 0.004 240)">{{m.v}}</span></span>
            </sc-for>
          </div>
          <button onClick="{{toggleDinner}}" class="press" style="{{dinnerBtn}}">{{photoLabel}}</button>
        </div>
    </div>

    <div style="border-bottom: 1px solid oklch(0.16 0.007 248)">
      <div style="{{rowStyle}}">
        <svg width="22" height="22" viewBox="0 0 30 30" aria-hidden="true" style="{{gX.glow}}"><path d="{{gX.star}}" fill="{{gX.fill}}" stroke="{{gX.c}}" stroke-width="1.5"></path></svg>
        <span style="flex: 1; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 27px; line-height: 1; color: oklch(0.95 0.004 240)">Misja</span>
        <span style="{{gX.valStyle}}">{{gX.value}}</span>
      </div>
        <div style="padding: 0 0 18px 36px">
          <span style="display: block; font-size: 14px; line-height: 1.45; color: oklch(0.75 0.006 240)">Pokonaj strach działaniem: zrób jedną rzecz, którą odkładasz.</span>
          <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px">
            <sc-for list="{{stamps}}" as="st" hint-placeholder-count="5">
              <svg width="18" height="18" viewBox="0 0 30 30" aria-hidden="true"><path d="{{st.d}}" fill="{{st.f}}" stroke="oklch(0.76 0.09 75)" stroke-width="1.5"></path></svg>
            </sc-for>
          </div>
          <button onClick="{{toggleMission}}" aria-pressed="{{missionDone}}" class="press" style="{{missionBtn}}">{{missionLabel}}</button>
        </div>
    </div>
  </div>

  <!-- Tydzień jako rząd gwiazd -->
  <section style="margin: 30px 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px">
    <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 28px; color: oklch(0.9 0.005 240)">Tydzień</h2>
    <div style="display: grid; grid-template-columns: repeat(7, 30px); gap: 2px">
      <sc-for list="{{weekStars}}" as="w" hint-placeholder-count="7">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="{{w.d}}" fill="{{w.f}}" style="{{w.glow}}"></path></svg>
          <span style="{{w.ls}}">{{w.day}}</span>
        </span>
      </sc-for>
    </div>
  </section>

  <!-- Cele tygodnia -->
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 34px 24px 0">
    <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 28px; color: oklch(0.9 0.005 240)">Cele tygodnia</h2>
    <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: oklch(0.6 0.008 240)">{{goalsDone}}/3 · PLAN →</a>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; margin: 6px 24px 0">
    <sc-for list="{{goals}}" as="g" hint-placeholder-count="3">
      <button onClick="{{g.toggle}}" aria-pressed="{{g.done}}" class="press" style="{{g.style}}">
        <span style="{{g.box}}">
          <sc-if value="{{g.done}}" hint-placeholder-val="{{ false }}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </sc-if>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="{{g.titleStyle}}">{{g.goal}}</span>
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: oklch(0.52 0.008 240)">{{g.meta}}</span>
        </span>
        <span style="{{g.dot}}"></span>
      </button>
    </sc-for>
  </div>

  <!-- Rada z książek (przewijana) -->
  <div style="margin: 30px 24px 0; padding-top: 20px; border-top: 1px solid oklch(0.16 0.007 248)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.18em; color: oklch(0.44 0.008 240)">RADA NA DZIŚ · {{quoteNo}}/3</span>
      <button onClick="{{nextQuote}}" aria-label="Następna rada" class="press" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid oklch(0.22 0.008 245); background: transparent; color: oklch(0.7 0.006 240); display: grid; place-items: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"></path></svg>
      </button>
    </div>
    <p style="margin: 6px 0 0; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 21px; line-height: 1.3; color: oklch(0.75 0.006 240)">{{quote}}</p>
    <span style="display: block; margin-top: 8px; font-size: 12px; font-weight: 600; color: oklch(0.5 0.008 240)">{{quoteSrc}}</span>
  </div>
</div>
</template>
<script>

class DCLogic { constructor(props){ this.props = props; this.state = {}; } setState(p){ Object.assign(this.state, p); __render(); } forceUpdate(){ __render(); } }

const NAWYKI = [['Backtest', 3], ['Kreatyna', 12], ['Książka', 6], ['Sen przed 23', 4]];
const CELE = [
  { goal: '3 treningi siłowe', role: 'Sportowiec', day: 'PN · ŚR · PT', c: '#D6D0C0', done: false },
  { goal: 'Backtest strategii', role: 'Trader', day: 'ŚR', c: 'oklch(0.72 0.11 170)', done: false },
  { goal: 'Obiad z rodzicami', role: 'Syn', day: 'ND', c: 'oklch(0.7 0.11 250)', done: true }
];
const RADY = [
  ['„Działanie leczy strach. Niezdecydowanie i odkładanie go karmią.”', 'Magia myślenia na wielką skalę, zasada III'],
  ['„Najpierw szukaj zrozumienia, potem bycia zrozumianym.”', '7 nawyków skutecznego działania, nawyk 5'],
  ['„Porównuj się z tym, kim byłeś wczoraj, a nie z kimś innym dziś.”', 'Z Twojej listy rad']
];
const IK = {
  check: 'M5 12.5l4.5 4.5L19 7.5',
  trening: 'M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11',
  posilki: 'M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z',
  misja: 'M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z'
};
const KOL = { nawyk: '#D6D0C0', trening: 'oklch(0.72 0.12 250)', posilek: 'oklch(0.74 0.11 175)', misja: 'oklch(0.76 0.09 75)' };
// gwiazdozbiór dnia: pozycje w polu 342×300, r = wielkość gwiazdy, a = gdzie stoi podpis
const GWIAZDY = [
  { id: 'sn', k: 'posilek', name: 'Śniadanie', x: 46, y: 120, r: 7, a: 'b' },
  { id: 'ob', k: 'posilek', name: 'Obiad', x: 108, y: 70, r: 7, a: 't' },
  { id: 'ko', k: 'posilek', name: 'Kolacja', x: 160, y: 136, r: 7, a: 'r' },
  { id: 'tr', k: 'trening', name: 'Trening', x: 240, y: 46, r: 12, a: 't' },
  { id: 'mi', k: 'misja', name: 'Misja', x: 306, y: 132, r: 10, a: 'b' },
  { id: 'h0', k: 'nawyk', name: 'Backtest', x: 262, y: 226, r: 7, a: 'b' },
  { id: 'h3', k: 'nawyk', name: 'Sen przed 23', x: 206, y: 176, r: 6, a: 'r' },
  { id: 'h2', k: 'nawyk', name: 'Książka', x: 140, y: 250, r: 7, a: 'b' },
  { id: 'h1', k: 'nawyk', name: 'Kreatyna', x: 52, y: 214, r: 7, a: 'b' }
];
const LINIE = [['sn', 'ob'], ['ob', 'ko'], ['ko', 'tr'], ['tr', 'mi'], ['mi', 'h0'], ['h0', 'h3'], ['h3', 'ko'], ['h3', 'h2'], ['h2', 'h1']];
const TYDZIEN = [['wt', 72], ['śr', 58], ['czw', 90], ['pt', 64], ['sob', 81], ['nd', 55]];

function star(x, y, r) {
  // czteroramienna iskra jak w gwiazdozbiorze rad
  const k = r * 0.28;
  return 'M' + x + ' ' + (y - r) + 'C' + (x + k * 0.4) + ' ' + (y - k) + ' ' + (x + k) + ' ' + (y - k * 0.4) + ' ' + (x + r) + ' ' + y +
    'C' + (x + k) + ' ' + (y + k * 0.4) + ' ' + (x + k * 0.4) + ' ' + (y + k) + ' ' + x + ' ' + (y + r) +
    'C' + (x - k * 0.4) + ' ' + (y + k) + ' ' + (x - k) + ' ' + (y + k * 0.4) + ' ' + (x - r) + ' ' + y +
    'C' + (x - k) + ' ' + (y - k * 0.4) + ' ' + (x - k * 0.4) + ' ' + (y - k) + ' ' + x + ' ' + (y - r) + 'Z';
}
const DUST = Array.from({ length: 22 }, (_, i) => {
  const a = Math.sin(i * 12.9898) * 43758.5453, b = Math.sin(i * 78.233) * 12345.678;
  return { x: ((a - Math.floor(a)) * 342).toFixed(1), y: ((b - Math.floor(b)) * 300).toFixed(1), r: (0.6 + (i % 3) * 0.35).toFixed(2), st: 'animation-delay:' + ((i * 0.37) % 3.6).toFixed(2) + 's' };
});

class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const habits = s.habits || [false, true, true, false];
    const trained = !!s.trained;
    const mission = !!s.mission;
    const dinner = !!s.dinner;
    const goals = s.goals || CELE.map((g) => g.done);
    const q = s.q || 0;
    const hd = habits.filter(Boolean).length;
    const kcal = 1350 + (dinner ? 700 : 0);
    const kcalP = kcal / 2600;
    const score = Math.round((hd / 4 + (trained ? 1 : 0) + kcalP + (mission ? 1 : 0)) / 4 * 100);
    const C = 2 * Math.PI * 40;

    const on = { sn: true, ob: true, ko: dinner, tr: trained, mi: mission, h0: habits[0], h1: habits[1], h2: habits[2], h3: habits[3] };
    const flip = (id) => {
      if (id === 'ko') return this.setState({ dinner: !dinner, born: !dinner ? id : null });
      if (id === 'tr') return this.setState({ trained: !trained, born: !trained ? id : null });
      if (id === 'mi') return this.setState({ mission: !mission, born: !mission ? id : null });
      if (id[0] === 'h') { const i = +id[1]; return this.setState({ habits: habits.map((v, j) => j === i ? !v : v), born: !habits[i] ? id : null }); }
    };
    const byId = Object.fromEntries(GWIAZDY.map((g) => [g.id, g]));
    const lit = GWIAZDY.filter((g) => on[g.id]).length;

    const todo = [];
    if (!trained) todo.push('trening');
    if (!mission) todo.push('misja');
    if (!dinner) todo.push('kolacja');
    if (hd < 4) todo.push((4 - hd) + ' nawyki');

    let n;
    if (!trained) n = { h: 'Czas na trening', l: 'FBW 1, 5 ćwiczeń, ok. 60 min', i: IK.trening, c: KOL.trening, f: () => flip('tr'), cta: 'Zapal' };

      dust: DUST,

        return { x1: A.x, y1: A.y, x2: B.x, y2: B.y, c: both ? 'oklch(0.86 0.04 80 / 0.9)' : 'oklch(0.4 0.008 245 / 0.5)', w: both ? 1.5 : 1, dash: both ? 'none' : '2 5' };

      toggleDinner: () => flip('ko'), photoLabel: dinner ? 'Usuń kolację' : 'Zrób zdjęcie kolacji',
      stamps: [0, 1, 2, 3, 4].map((i) => ({ d: star(15, 15, i === 2 ? 12 : 10), f: i < 2 || (i === 2 && mission) ? KOL.misja : 'oklch(0.07 0.004 250)' })),

        titleStyle: "font-family:'Instrument Serif',serif;font-style:italic;font-size:20px;line-height:1.1;" + (goals[i] ? 'color:oklch(0.52 0.008 240);text-decoration:line-through' : 'color:oklch(0.95 0.004 240)'),
        dot: 'width:8px;height:8px;flex:none;border-radius:50%;background:' + g.c
      })),

    };
  }
}

(function(){
  const props = {};
  const comp = new Component(props);
  const tpl = document.getElementById('dc-tpl');
  const root = document.getElementById('dc-root');
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(path, scope){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((o,k)=> o == null ? undefined : o[k], scope);
  }
  function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
  function proc(node, scope){
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
    if (node.nodeType !== 1) { if (node.nodeType === 8) node.remove(); return; }
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      const list = (m ? look(m[1], scope) : []) || [];
      const as = node.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        Array.from(node.childNodes).forEach(c => { const cl = c.cloneNode(true); const holder = document.createElement('div'); holder.appendChild(cl); proc(cl, s); while (holder.firstChild) frag.appendChild(holder.firstChild); });
      });
      node.replaceWith(frag); return;
    }
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (!(m && look(m[1], scope))) { node.remove(); return; }
      Array.from(node.childNodes).forEach(c => proc(c, scope));
      node.replaceWith(...Array.from(node.childNodes)); return;
    }
    for (const a of Array.from(node.attributes)) {
      if (a.name.startsWith('hint-')) { node.removeAttribute(a.name); continue; }
      if (!a.value.includes('{{')) continue;
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (a.name.startsWith('on') && whole) {
        node.removeAttribute(a.name);
        const fn = look(whole[1], scope);
        if (typeof fn === 'function') node.addEventListener(a.name.slice(2), fn);
        continue;
      }
      node.setAttribute(a.name, interp(a.value, scope));
    }
    Array.from(node.childNodes).forEach(c => proc(c, scope));
  }
  window.__render = function(){
    const saved = {}, ae = document.activeElement, focusId = ae && ae.id;
    let caret = null; try { caret = ae && ae.selectionStart; } catch (e) {}
    root.querySelectorAll('input[id],select[id],textarea[id]').forEach(e => { if (e.type === 'file') return; saved[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
    const frag = tpl.content.cloneNode(true);
    const vals = comp.renderVals();
    Array.from(frag.childNodes).forEach(c => proc(c, vals));
    root.replaceChildren(frag);
    Object.keys(saved).forEach(id => { const e = document.getElementById(id); if (!e || e.type === 'file' || e.hasAttribute('value') && e.type !== 'date') return; if (e.type === 'checkbox') e.checked = saved[id]; else e.value = saved[id]; });
    if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); try { if (caret != null) f.setSelectionRange(caret, caret); } catch (e) {} } }
  };
  __render();
  if (typeof comp.componentDidMount === 'function') comp.componentDidMount();
})();
