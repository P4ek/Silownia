<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nawyki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:oklch(0.07 0.004 250)}
a{color:#D6D0C0}a:hover{color:#ffffff}
button{font-family:inherit;cursor:pointer}
.glow{filter:drop-shadow(0 0 6px rgba(214,208,192,0.75))}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="width: 390px; min-height: 100vh; margin: 0 auto; padding-bottom: 64px; box-sizing: border-box; background: oklch(0.07 0.004 250); color: oklch(0.85 0.005 240); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 64px; overflow: hidden">

  <!-- Dziś jako bohater ekranu -->
  <header style="position: relative; padding: 56px 24px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Menu" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid oklch(0.19 0.008 245); background: oklch(0.1 0.006 250); color: oklch(0.85 0.005 240); display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.44 0.008 240)">NAWYKI · TYDZIEŃ 40</span>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 14px; margin-top: 18px">
      <span style="font-family: 'Instrument Serif', serif; font-size: 150px; line-height: 0.78; color: oklch(0.95 0.004 240); letter-spacing: -0.03em">4</span>
      <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 6px">
        <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 34px; line-height: 1; color: oklch(0.93 0.004 240)">Niedziela</span>
        <span style="font-size: 14px; color: oklch(0.52 0.008 240)">października · ostatni dzień tygodnia</span>
      </div>
    </div>
  </header>

  <!-- Dzisiejsze kafle -->
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 34px 24px 0">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: oklch(0.52 0.008 240)">DZIŚ DO ODHACZENIA</span>
    <span style="font-size: 13px; font-weight: 600; color: #D6D0C0">{{todayDone}}/4</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 24px 0">
    <sc-for list="{{today}}" as="t" hint-placeholder-count="4">
      <button onClick="{{t.toggle}}" aria-pressed="{{t.on}}" style="{{t.style}}">
        <span style="{{t.stamp}}">
          <sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </sc-if>
        </span>
        <span style="font-size: 16px; font-weight: 700; line-height: 1.2">{{t.name}}</span>
        <span style="{{t.subStyle}}">{{t.sub}}</span>
      </button>
    </sc-for>
  </div>

  <!-- Tydzień w liczbach -->
  <section style="margin: 28px 24px 0; padding: 22px; border-radius: 28px; background: oklch(0.1 0.006 250); border: 1px solid oklch(0.19 0.008 245)">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: flex-start">
        <span style="font-family: 'Instrument Serif', serif; font-size: 96px; line-height: 0.8; color: oklch(0.95 0.004 240)">{{pct}}</span>
        <span style="font-family: 'Instrument Serif', serif; font-size: 32px; color: oklch(0.52 0.008 240)">%</span>
      </div>
      <div style="text-align: right; display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px">
        <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 24px; color: oklch(0.93 0.004 240)">{{done}} z 28</span>
        <span style="font-size: 12px; color: oklch(0.52 0.008 240)">gwiazd zapalonych w tym tygodniu</span>
      </div>
    </div>

    <!-- Niebo tygodnia: 4 nawyki × 7 dni -->
    <div style="position: relative; margin-top: 24px">
      <div style="{{todayBand}}"></div>
      <div style="position: relative; display: grid; grid-template-columns: 70px repeat(7, minmax(0, 1fr)); row-gap: 6px; align-items: center">
        <span></span>
        <sc-for list="{{heads}}" as="h" hint-placeholder-count="7">
          <span style="{{h.style}}">{{h.short}}</span>
        </sc-for>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <span style="font-size: 12px; font-weight: 600; color: oklch(0.6 0.008 240); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.short}}</span>
          <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="7">
            <button onClick="{{c.toggle}}" aria-label="{{c.aria}}" aria-pressed="{{c.on}}" style="height: 40px; border: none; background: transparent; padding: 0; display: grid; place-items: center">
              <sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}">
                <svg class="glow" width="22" height="22" viewBox="0 0 24 24" fill="#D6D0C0"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"></path></svg>
              </sc-if>
              <sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}">
                <span style="{{c.dot}}"></span>
              </sc-if>
            </button>
          </sc-for>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 16px; border-top: 1px solid oklch(0.16 0.007 248)">
      <button aria-label="Poprzedni tydzień" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid oklch(0.19 0.008 245); background: transparent; color: oklch(0.7 0.006 240); display: grid; place-items: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span style="font-size: 14px; font-weight: 600; color: oklch(0.7 0.006 240)">28 wrz – 4 paź</span>
      <button aria-label="Następny tydzień" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid oklch(0.19 0.008 245); background: transparent; color: oklch(0.7 0.006 240); display: grid; place-items: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </section>

  <button style="margin: 16px 24px 0; width: 342px; height: 64px; border-radius: 22px; border: 1.5px dashed oklch(0.3 0.008 245); background: transparent; color: oklch(0.7 0.006 240); font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    Nowy nawyk – nowa gwiazda
  </button>
</div>
</template>
<script>

class DCLogic { constructor(props){ this.props = props; this.state = {}; } setState(p){ Object.assign(this.state, p); __render(); } forceUpdate(){ __render(); } }

const DNI = ['PN','WT','ŚR','CZ','PT','SO','ND'];
const PELNE = ['poniedziałek','wtorek','środa','czwartek','piątek','sobota','niedziela'];
const DZIS = 6;
const NAWYKI = [
  { name: 'Backtest', short: 'Backtest' }, { name: 'Branie kreatyny', short: 'Kreatyna' },
  { name: 'Czytanie książki', short: 'Książka' }, { name: 'Trening', short: 'Trening' }
];
const START = { 'Czytanie książki-0': true, 'Trening-1': true };

class Component extends DCLogic {
  renderVals() {
    const checks = (this.state && this.state.checks) || START;
    const on = (h, d) => !!checks[h + '-' + d];
    const flip = (h, d) => () => {
      const next = Object.assign({}, (this.state && this.state.checks) || START);
      next[h + '-' + d] = !next[h + '-' + d];
      this.setState({ checks: next });
    };
    let done = 0;
    NAWYKI.forEach((h) => DNI.forEach((_, d) => { if (on(h.name, d)) done++; }));
    const tilts = [-6, 4, -3, 7];
    const today = NAWYKI.map((h, i) => {
      const o = on(h.name, DZIS);
      const week = DNI.filter((_, d) => on(h.name, d)).length;
      return {
        name: h.name, on: o, toggle: flip(h.name, DZIS),
        sub: o ? 'zrobione dziś' : week + '/7 w tym tygodniu',
        subStyle: 'font-size:12px;' + (o ? 'color:oklch(0.1 0.006 250 / 0.65)' : 'color:oklch(0.52 0.008 240)'),
        style: 'position:relative;min-height:128px;padding:16px;border-radius:22px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;text-align:left;' +
          (o ? 'border:none;background:#D6D0C0;color:oklch(0.1 0.006 250);box-shadow:0 18px 40px -18px rgba(214,208,192,0.6)' : 'border:1px solid oklch(0.19 0.008 245);background:oklch(0.1 0.006 250);color:oklch(0.9 0.004 240)'),
        stamp: 'position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transform:rotate(' + tilts[i] + 'deg);' +
          (o ? 'background:oklch(0.1 0.006 250);color:#D6D0C0' : 'border:1.5px dashed oklch(0.3 0.008 245)')
      };
    });
    const rows = NAWYKI.map((h) => ({
      short: h.short,
      cells: DNI.map((d, i) => {
        const o = on(h.name, i);
        return {
          on: o, off: !o, toggle: flip(h.name, i), aria: h.name + ', ' + PELNE[i] + (o ? ' – zrobione' : ''),
          dot: 'width:4px;height:4px;border-radius:50%;background:' + (i === DZIS ? '#D6D0C0' : 'oklch(0.3 0.008 245)')
        };
      })
    }));
    return {
      today: today, rows: rows, done: done,
      todayDone: NAWYKI.filter((h) => on(h.name, DZIS)).length,
      pct: Math.round(done / 28 * 100),
      heads: DNI.map((d, i) => ({ short: d, style: 'text-align:center;font-size:10px;font-weight:700;letter-spacing:0.08em;padding-bottom:4px;color:' + (i === DZIS ? '#D6D0C0' : 'oklch(0.44 0.008 240)') })),
      todayBand: 'position:absolute;top:0;bottom:0;right:0;width:calc((100% - 70px) / 7);border-radius:14px;background:oklch(0.14 0.008 248)'
    };
  }
}

(function(){
  const props = {};
  const comp = new Component(props);
  const tpl = document.getElementById('dc-tpl');
  const root = document.getElementById('dc-root');
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(path, scope){
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((o,k)=> o == null ? undefined : o[k], scope);
  }
  function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
  function proc(node, scope){
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
    if (node.nodeType !== 1) { if (node.nodeType === 8) node.remove(); return; }
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      const list = (m ? look(m[1], scope) : []) || [];
      const as = node.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        Array.from(node.childNodes).forEach(c => { const cl = c.cloneNode(true); const holder = document.createElement('div'); holder.appendChild(cl); proc(cl, s); while (holder.firstChild) frag.appendChild(holder.firstChild); });
      });
      node.replaceWith(frag); return;
    }
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value')||'').match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (!(m && look(m[1], scope))) { node.remove(); return; }
      Array.from(node.childNodes).forEach(c => proc(c, scope));
      node.replaceWith(...Array.from(node.childNodes)); return;
    }
    for (const a of Array.from(node.attributes)) {
      if (a.name.startsWith('hint-')) { node.removeAttribute(a.name); continue; }
      if (!a.value.includes('{{')) continue;
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (a.name.startsWith('on') && whole) {
        node.removeAttribute(a.name);
        const fn = look(whole[1], scope);
        if (typeof fn === 'function') node.addEventListener(a.name.slice(2), fn);
        continue;
      }
      node.setAttribute(a.name, interp(a.value, scope));
    }
    Array.from(node.childNodes).forEach(c => proc(c, scope));
  }
  window.__render = function(){
    const saved = {}, ae = document.activeElement, focusId = ae && ae.id;
    let caret = null; try { caret = ae && ae.selectionStart; } catch (e) {}
    root.querySelectorAll('input[id],select[id],textarea[id]').forEach(e => { saved[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
    const frag = tpl.content.cloneNode(true);
    const vals = comp.renderVals();
    Array.from(frag.childNodes).forEach(c => proc(c, vals));
    root.replaceChildren(frag);
    Object.keys(saved).forEach(id => { const e = document.getElementById(id); if (!e || e.hasAttribute('value') && e.type !== 'date') return; if (e.type === 'checkbox') e.checked = saved[id]; else e.value = saved[id]; });
    if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); try { if (caret != null) f.setSelectionRange(caret, caret); } catch (e) {} } }
  };
  __render();
})();

</script>
</body>
</html>
