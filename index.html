<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dziennik treningowy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF3E7;
    --card: #FFFDF8;
    --ink: #2A2320;
    --muted: #8C8073;
    --border: #ECE1CF;
    --accent: #E2643F;
    --accent-soft: #FCEAE2;
    --shadow-warm: 0 14px 34px -16px rgba(226, 100, 63, 0.30), 0 2px 8px rgba(180, 150, 120, 0.12);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    background:
      radial-gradient(1000px 620px at 100% -5%, rgba(226, 100, 63, 0.16), rgba(226, 100, 63, 0) 62%),
      var(--cream);
    background-attachment: fixed;
    min-height: 100vh;
  }

  h1, h2, legend, .rekord-baner {
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: 0.01em;
  }
  h1 { font-size: 2.1rem; margin: 4px 0 20px; padding-left: 52px; line-height: 1.15; }
  h2 { font-size: 1.5rem; margin: 0 0 14px; }

  .kontener {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 64px;
  }
  .kontener > h1,
  .kontener > section { position: relative; z-index: 1; }
  .blob {
    position: absolute;
    width: 340px;
    height: 340px;
    right: -70px;
    top: -60px;
    background: radial-gradient(circle at 32% 30%, #E2643F, #F2A576);
    border-radius: 46% 54% 62% 38% / 52% 44% 56% 48%;
    filter: blur(64px);
    opacity: 0.11;
    pointer-events: none;
    z-index: 0;
  }

  /* ----- Hamburger ----- */
  .hamburger {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 60;
    width: 42px;
    height: 42px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: var(--shadow-warm);
    cursor: pointer;
  }
  .hamburger span {
    display: block;
    width: 18px;
    height: 2px;
    border-radius: 2px;
    background: var(--ink);
  }

  /* ----- Panel boczny ----- */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(42, 35, 32, 0.38);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    z-index: 50;
  }
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: min(280px, 82vw);
    background: #fff;
    border-right: 1px solid var(--border);
    box-shadow: 6px 0 30px -10px rgba(150, 110, 90, 0.35);
    transform: translateX(-100%);
    transition: transform 0.24s ease;
    z-index: 55;
    padding: 64px 12px 20px;
    overflow-y: auto;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar h3 {
    margin: 0 0 8px;
    padding: 8px 12px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 13px 14px;
    margin: 3px 0;
    background: none;
    border: none;
    border-radius: 13px;
    font: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .nav-btn svg {
    width: 20px;
    height: 20px;
    flex: none;
    color: var(--muted);
    transition: color 0.15s ease;
  }
  .nav-btn:hover { background: #F7F1E6; }
  .nav-btn.aktywny {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
  }
  .nav-btn.aktywny svg { color: var(--accent); }

  /* ----- Widoki ----- */
  .widok { display: none; }
  .widok.aktywny { display: block; }

  /* ----- Karty / formularze ----- */
  form,
  .karta,
  .rejestr-tabela > tbody > tr > td,
  .wpis {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow-warm);
  }
  form, .karta { padding: 20px; }

  label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin: 14px 0 5px;
    color: var(--ink);
  }
  form > label:first-of-type { margin-top: 0; }
  select, input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    font: inherit;
    color: var(--ink);
  }
  select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(226, 100, 63, 0.16);
  }
  select:disabled { background: #F4EEE2; color: var(--muted); }

  fieldset {
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-top: 16px;
    padding: 12px 14px 14px;
  }
  legend { padding: 0 8px; font-size: 1.05rem; }

  .set-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 10px;
    align-items: end;
  }
  .set-row label { margin: 0 0 4px; font-weight: 500; font-size: 0.78rem; color: var(--muted); }
  .set-row .field-weight, .set-row .field-reps { min-width: 0; }

  button { font: inherit; cursor: pointer; }
  #dodaj-podejscie {
    padding: 9px 16px;
    border: 1px dashed var(--accent);
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    font-size: 0.85rem;
  }
  #dodaj-podejscie:hover { background: #FBDECF; }
  .btn-remove {
    padding: 10px 12px;
    border: 1px solid #E7C3B4;
    border-radius: 11px;
    background: #F8E7E0;
    color: #B4482C;
    font-size: 0.82rem;
  }
  .btn-remove:hover { background: #F3D7CC; }

  .btn-submit {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 14px 24px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #EF7B50, #E2643F 55%, #CF5330);
    color: #fff;
    font-weight: 700;
    font-size: 0.98rem;
    letter-spacing: 0.01em;
    box-shadow: 0 12px 26px -8px rgba(226, 100, 63, 0.55);
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn-submit:hover { filter: brightness(1.05); }
  .btn-submit:active { transform: translateY(1px); }
  .btn-submit:disabled { opacity: 0.55; box-shadow: none; cursor: default; }

  /* ----- Baner rekordu ----- */
  .rekord-baner {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    padding: 12px 20px;
    border-radius: 999px;
    background: linear-gradient(135deg, #EF7B50, #E2643F 60%, #CF5330);
    color: #fff;
    font-size: 1.05rem;
    box-shadow: 0 12px 26px -10px rgba(226, 100, 63, 0.5);
  }
  .rekord-baner svg { width: 20px; height: 20px; flex: none; }
  .rekord-baner span { font-style: italic; }

  /* ----- Kropki partii ----- */
  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
    flex: none;
    vertical-align: 1px;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.6);
  }
  .dot-Klata   { background: #E2643F; }
  .dot-Plecy   { background: #3F7DE2; }
  .dot-Biceps  { background: #8B5CF6; }
  .dot-Triceps { background: #12A594; }
  .dot-Barki   { background: #E0A82E; }
  .dot-Brzuch  { background: #D6409F; }
  .dot-Nogi    { background: #5B8C2A; }

  /* ----- Ostatnio dodane ----- */
  #lista { margin-top: 14px; }
  .wpis {
    padding: 14px 16px;
    margin-bottom: 12px;
    border-left: 3px solid var(--accent);
  }
  .wpis-naglowek { font-weight: 700; margin-bottom: 3px; }
  .wpis-data { color: var(--muted); font-size: 0.82rem; margin-bottom: 8px; }
  .wpis ul { margin: 0; padding-left: 20px; }
  .wpis li { margin: 2px 0; }
  .pusto {
    color: var(--muted);
    font-style: italic;
    padding: 18px;
    margin: 0;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 16px;
  }

  /* ----- Rejestr ćwiczeń ----- */
  #rejestr { overflow-x: auto; }
  .rejestr-tabela {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 12px;
  }
  .rejestr-tabela > thead th {
    text-align: left;
    padding: 4px 16px;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.05rem;
    color: var(--muted);
  }
  .rejestr-tabela > tbody > tr > td {
    padding: 14px 16px;
    vertical-align: top;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .rejestr-tabela > tbody > tr > td:first-child {
    border-left: 3px solid var(--accent);
    border-radius: 18px 0 0 18px;
  }
  .rejestr-tabela > tbody > tr > td:last-child {
    border-right: 1px solid var(--border);
    border-radius: 0 18px 18px 0;
  }
  .rejestr-dzien, .rejestr-partia { white-space: nowrap; }
  .rejestr-dzien { font-weight: 700; }
  .rejestr-cwiczenia { width: 100%; border-collapse: collapse; }
  .rejestr-cwiczenia th, .rejestr-cwiczenia td {
    text-align: left;
    padding: 6px 10px 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .rejestr-cwiczenia th { color: var(--muted); font-weight: 600; }
  .rejestr-cwiczenia tr:last-child td { border-bottom: none; }
  .rejestr-cwiczenia td:last-child { color: var(--muted); }

  /* ----- Katalog ćwiczeń (widok "Dodaj nowe ćwiczenie") ----- */
  #katalog-lista { margin-top: 14px; }
  .katalog-grupa { margin-bottom: 16px; }
  .katalog-grupa h4 {
    margin: 0 0 8px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 700;
  }
  .katalog-wiersz {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .katalog-nazwa { display: flex; align-items: center; }
  .btn-usun-cwiczenie {
    flex: none;
    padding: 8px 12px;
    border: 1px solid #E7C3B4;
    border-radius: 11px;
    background: #F8E7E0;
    color: #B4482C;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .btn-usun-cwiczenie:hover { background: #F3D7CC; }
  .btn-usun-cwiczenie:disabled { opacity: 0.55; cursor: default; }

  /* ----- Wykres / status ----- */
  #wykres { max-width: 100%; margin-top: 8px; }
  #wykres-brak { color: var(--muted); font-style: italic; margin: 14px 0 0; }
  #nowe-status { margin: 12px 0 0; font-size: 0.9rem; font-weight: 600; }

  /* ----- Responsywność ----- */
  @media (max-width: 560px) {
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.3rem; }
    .kontener { padding: 16px 12px 56px; }
    form, .karta { padding: 16px; }
    .rekord-baner { font-size: 0.95rem; padding: 11px 16px; }
  }
  @media (max-width: 380px) {
    .set-row { grid-template-columns: 1fr 1fr; }
    .set-row .btn-remove { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<button class="hamburger" id="hamburger" aria-label="Menu">
  <span></span><span></span><span></span>
</button>

<div id="overlay" hidden></div>

<nav id="sidebar">
  <h3>Menu</h3>
  <button class="nav-btn aktywny" data-widok="widok-dodaj">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    <span>Dodaj ćwiczenie</span>
  </button>
  <button class="nav-btn" data-widok="widok-rejestr">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
    <span>Rejestr ćwiczeń</span>
  </button>
  <button class="nav-btn" data-widok="widok-wykres">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><polyline points="7 14 11 10 14 13 20 7"/></svg>
    <span>Wykres postępu</span>
  </button>
  <button class="nav-btn" data-widok="widok-nowe">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6M7 6v12M17 6v12M20 9v6M7 12h10"/></svg>
    <span>Dodaj nowe ćwiczenie</span>
  </button>
</nav>

<div class="kontener">
  <div class="blob" aria-hidden="true"></div>

  <h1>Dziennik treningowy</h1>

  <!-- ===== Widok 1: Dodaj ćwiczenie ===== -->
  <section id="widok-dodaj" class="widok aktywny">
    <h2>Dodaj ćwiczenie</h2>

    <div id="rekord-baner" class="rekord-baner" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 1.5c.6 3.6-1.4 5.6-3 7.2-1.6 1.6-3 3.2-3 6.1a5.5 5.5 0 0 0 11 .3c.1-2.3-1-4.2-2-5.4-.6.9-1.4 1.2-2.2 1.2 1.3-2.8 1-7-.8-9.4z"/></svg>
      <span id="rekord-tekst"></span>
    </div>

    <form id="form-treningu">
      <label for="partia">Partia mięśniowa</label>
      <select id="partia" name="partia" required>
        <option value="">-- wybierz partię --</option>
      </select>

      <label for="cwiczenie">Ćwiczenie</label>
      <select id="cwiczenie" name="cwiczenie" required disabled>
        <option value="">-- najpierw wybierz partię --</option>
      </select>

      <label for="data">Data</label>
      <input type="date" id="data" name="data" required>

      <fieldset>
        <legend>Podejścia</legend>
        <div id="podejscia"></div>
        <button type="button" id="dodaj-podejscie">+ dodaj podejście</button>
      </fieldset>

      <button type="submit" class="btn-submit">Dodaj ćwiczenie</button>
    </form>

    <h2 style="margin-top:28px">Ostatnio dodane</h2>
    <div id="lista">
      <p class="pusto">Brak zapisanych treningów.</p>
    </div>
  </section>

  <!-- ===== Widok 2: Rejestr ćwiczeń ===== -->
  <section id="widok-rejestr" class="widok">
    <h2>Rejestr ćwiczeń</h2>
    <div id="rejestr">
      <p class="pusto">Brak zapisanych treningów.</p>
    </div>
  </section>

  <!-- ===== Widok 3: Wykres postępu ===== -->
  <section id="widok-wykres" class="widok">
    <h2>Wykres postępu</h2>
    <div class="karta">
      <label for="wykres-cwiczenie">Ćwiczenie</label>
      <select id="wykres-cwiczenie">
        <option value="">-- wybierz ćwiczenie --</option>
      </select>
      <canvas id="wykres" height="240"></canvas>
      <p id="wykres-brak" hidden>Brak jeszcze danych dla tego ćwiczenia</p>
    </div>
  </section>

  <!-- ===== Widok 4: Dodaj nowe ćwiczenie ===== -->
  <section id="widok-nowe" class="widok">
    <h2>Dodaj nowe ćwiczenie</h2>
    <form id="form-nowe-cwiczenie">
      <label for="nowe-partia">Partia mięśniowa</label>
      <select id="nowe-partia" required>
        <option value="">-- wybierz partię --</option>
      </select>

      <label for="nowe-nazwa">Nazwa ćwiczenia</label>
      <input type="text" id="nowe-nazwa" autocomplete="off" required>

      <button type="submit" class="btn-submit">Zapisz ćwiczenie</button>
      <p id="nowe-status" hidden></p>
    </form>

    <h2 style="margin-top:28px">Katalog ćwiczeń</h2>
    <div id="katalog-lista">
      <p class="pusto">Brak zapisanych ćwiczeń.</p>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const SUPABASE_URL = "https://yrnubpuffivauxatvthr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4nd418S2FdKpFmp5vGh1Ug_jltWAFrI";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Stała lista partii; ćwiczenia pobierane z tabeli "cwiczenia"
  const PARTIE = ["Klata", "Plecy", "Biceps", "Triceps", "Barki", "Brzuch", "Nogi"];
  let katalog = []; // wiersze z tabeli "cwiczenia": { partia, nazwa }

  function cwiczeniaDlaPartii(partia) {
    return katalog
      .filter(function (c) { return c.partia === partia; })
      .map(function (c) { return c.nazwa; })
      .sort(function (a, b) { return a.localeCompare(b, "pl"); });
  }

  const form = document.getElementById("form-treningu");
  const selPartia = document.getElementById("partia");
  const selCwiczenie = document.getElementById("cwiczenie");
  const inputData = document.getElementById("data");
  const podejsciaBox = document.getElementById("podejscia");
  const btnDodaj = document.getElementById("dodaj-podejscie");
  const lista = document.getElementById("lista");
  const rejestrBox = document.getElementById("rejestr");
  const selWykres = document.getElementById("wykres-cwiczenie");
  const wykresBrak = document.getElementById("wykres-brak");
  const formNowe = document.getElementById("form-nowe-cwiczenie");
  const selNowePartia = document.getElementById("nowe-partia");
  const inputNoweNazwa = document.getElementById("nowe-nazwa");
  const noweStatus = document.getElementById("nowe-status");
  const katalogLista = document.getElementById("katalog-lista");
  const rekordBaner = document.getElementById("rekord-baner");
  const rekordTekst = document.getElementById("rekord-tekst");

  // Wszystkie pobrane wpisy z tabeli "treningi"
  const wpisy = [];

  // ----- Nawigacja: hamburger + panel boczny -----
  const hamburger = document.getElementById("hamburger");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  const widoki = document.querySelectorAll(".widok");
  const navBtns = document.querySelectorAll(".nav-btn");

  function otworzPanel() {
    sidebar.classList.add("open");
    overlay.hidden = false;
  }
  function zamknijPanel() {
    sidebar.classList.remove("open");
    overlay.hidden = true;
  }
  hamburger.addEventListener("click", otworzPanel);
  overlay.addEventListener("click", zamknijPanel);

  navBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      const cel = btn.dataset.widok;
      widoki.forEach(function (w) { w.classList.toggle("aktywny", w.id === cel); });
      navBtns.forEach(function (b) { b.classList.toggle("aktywny", b === btn); });
      if (cel === "widok-rejestr") renderRejestr();
      zamknijPanel();
    });
  });

  // Wypełnienie selectów partii (formularz treningu + dodawanie nowego ćwiczenia)
  PARTIE.forEach(function (partia) {
    selPartia.appendChild(new Option(partia, partia));
    selNowePartia.appendChild(new Option(partia, partia));
  });

  // Odbudowa selecta ćwiczeń w formularzu treningu (zależny od wybranej partii)
  function odbudujSelectCwiczenie() {
    const partia = selPartia.value;
    const poprzednie = selCwiczenie.value;
    selCwiczenie.innerHTML = "";

    if (!partia) {
      selCwiczenie.disabled = true;
      selCwiczenie.appendChild(new Option("-- najpierw wybierz partię --", ""));
      return;
    }

    selCwiczenie.disabled = false;
    selCwiczenie.appendChild(new Option("-- wybierz ćwiczenie --", ""));
    cwiczeniaDlaPartii(partia).forEach(function (nazwa) {
      selCwiczenie.appendChild(new Option(nazwa, nazwa));
    });
    if (poprzednie) selCwiczenie.value = poprzednie;
  }

  // Odbudowa selecta ćwiczeń na wykresie (wszystkie partie, pogrupowane)
  function odbudujSelectWykres() {
    const poprzednie = selWykres.value;
    selWykres.innerHTML = "";
    selWykres.appendChild(new Option("-- wybierz ćwiczenie --", ""));

    PARTIE.forEach(function (partia) {
      const nazwy = cwiczeniaDlaPartii(partia);
      if (nazwy.length === 0) return;
      const grupa = document.createElement("optgroup");
      grupa.label = partia;
      nazwy.forEach(function (nazwa) { grupa.appendChild(new Option(nazwa, nazwa)); });
      selWykres.appendChild(grupa);
    });
    if (poprzednie) selWykres.value = poprzednie;
  }

  // Odświeżenie wszystkich list ćwiczeń na stronie
  function odswiezSelectyCwiczen() {
    odbudujSelectCwiczenie();
    odbudujSelectWykres();
    renderKatalogListy();
  }

  // Pobranie katalogu ćwiczeń z tabeli "cwiczenia"
  async function wczytajKatalog() {
    const { data, error } = await db
      .from("cwiczenia")
      .select("*")
      .order("partia", { ascending: true })
      .order("nazwa", { ascending: true });

    if (error) {
      console.error(error);
      alert("Nie udało się pobrać listy ćwiczeń: " + error.message);
      return;
    }
    katalog = data || [];
    odswiezSelectyCwiczen();
  }
  wczytajKatalog();

  // Ustawienie dzisiejszej daty
  function dzisiaj() {
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
  }
  inputData.value = dzisiaj();

  // Aktualizacja listy ćwiczeń po wyborze partii
  selPartia.addEventListener("change", odbudujSelectCwiczenie);

  // Wiersz podejścia
  function stworzWiersz() {
    const row = document.createElement("div");
    row.className = "set-row";

    const wrapW = document.createElement("div");
    wrapW.className = "field-weight";
    const labW = document.createElement("label");
    labW.textContent = "Ciężar (kg)";
    const inpW = document.createElement("input");
    inpW.type = "number";
    inpW.name = "ciezar";
    inpW.min = "0";
    inpW.step = "0.5";
    inpW.required = true;
    wrapW.appendChild(labW);
    wrapW.appendChild(inpW);

    const wrapR = document.createElement("div");
    wrapR.className = "field-reps";
    const labR = document.createElement("label");
    labR.textContent = "Powtórzenia";
    const inpR = document.createElement("input");
    inpR.type = "number";
    inpR.name = "powtorzenia";
    inpR.min = "1";
    inpR.step = "1";
    inpR.required = true;
    wrapR.appendChild(labR);
    wrapR.appendChild(inpR);

    const btnDel = document.createElement("button");
    btnDel.type = "button";
    btnDel.className = "btn-remove";
    btnDel.textContent = "usuń";
    btnDel.addEventListener("click", function () {
      row.remove();
      if (podejsciaBox.children.length === 0) {
        podejsciaBox.appendChild(stworzWiersz());
      }
    });

    row.appendChild(wrapW);
    row.appendChild(wrapR);
    row.appendChild(btnDel);
    return row;
  }

  function resetPodejscia() {
    podejsciaBox.innerHTML = "";
    podejsciaBox.appendChild(stworzWiersz());
  }
  resetPodejscia();

  btnDodaj.addEventListener("click", function () {
    podejsciaBox.appendChild(stworzWiersz());
  });

  // Kolorowa kropka danej partii
  function kropkaPartii(partia) {
    const s = document.createElement("span");
    s.className = "dot dot-" + partia;
    return s;
  }

  // Budowa kafelka pojedynczego wpisu
  function budujWpis(row) {
    const wpis = document.createElement("div");
    wpis.className = "wpis";

    const naglowek = document.createElement("div");
    naglowek.className = "wpis-naglowek";
    naglowek.appendChild(kropkaPartii(row.partia));
    naglowek.appendChild(document.createTextNode(row.partia + " — " + row.cwiczenie));

    const dataEl = document.createElement("div");
    dataEl.className = "wpis-data";
    dataEl.textContent = row.data;

    const ul = document.createElement("ul");
    (row.podejscia || []).forEach(function (p, i) {
      const li = document.createElement("li");
      li.textContent = "Podejście " + (i + 1) + ": " + p["cieżar"] + " kg × " + p.powtorzenia;
      ul.appendChild(li);
    });

    wpis.appendChild(naglowek);
    wpis.appendChild(dataEl);
    wpis.appendChild(ul);
    return wpis;
  }

  // Baner z najcięższym zanotowanym podejściem
  function renderRekord() {
    let best = null;
    wpisy.forEach(function (w) {
      (w.podejscia || []).forEach(function (p) {
        const c = Number(p["cieżar"]) || 0;
        const r = Number(p.powtorzenia) || 0;
        if (!best || c > best.c || (c === best.c && r > best.r)) {
          best = { c: c, r: r, cw: w.cwiczenie };
        }
      });
    });
    if (!best || best.c <= 0) { rekordBaner.hidden = true; return; }
    rekordTekst.textContent =
      "Ostatni rekord: " + best.cw + " — " + best.c + " kg × " + best.r;
    rekordBaner.hidden = false;
  }

  // Render listy "Ostatnio dodane" - tylko wpisy z dzisiejszą datą (reset o północy)
  function renderOstatnio() {
    const dzis = dzisiaj();
    const dzisiejsze = wpisy.filter(function (w) { return w.data === dzis; });

    lista.innerHTML = "";
    if (dzisiejsze.length === 0) {
      lista.innerHTML = '<p class="pusto">Brak ćwiczeń dodanych dzisiaj.</p>';
      return;
    }
    dzisiejsze.slice().reverse().forEach(function (row) {
      lista.appendChild(budujWpis(row));
    });
  }

  // Zaplanuj odświeżenie listy tuż po najbliższej północy (i tak co dobę)
  function zaplanujResetOPolnocy() {
    const teraz = new Date();
    const polnoc = new Date(
      teraz.getFullYear(), teraz.getMonth(), teraz.getDate() + 1, 0, 0, 2
    );
    setTimeout(function () {
      renderOstatnio();
      zaplanujResetOPolnocy();
    }, polnoc - teraz);
  }
  zaplanujResetOPolnocy();

  // Render widoku "Rejestr ćwiczeń" - tabela pogrupowana po dniach
  function renderRejestr() {
    const grupy = {};
    wpisy.forEach(function (w) {
      (grupy[w.data] = grupy[w.data] || []).push(w);
    });
    const daty = Object.keys(grupy).sort().reverse();

    rejestrBox.innerHTML = "";
    if (daty.length === 0) {
      rejestrBox.innerHTML = '<p class="pusto">Brak zapisanych treningów.</p>';
      return;
    }

    const tabela = document.createElement("table");
    tabela.className = "rejestr-tabela";
    tabela.innerHTML = "<thead><tr><th>Dzień treningowy</th><th>Ćwiczenia</th></tr></thead>";

    const tbody = document.createElement("tbody");
    daty.forEach(function (d) {
      const tr = document.createElement("tr");

      const tdDzien = document.createElement("td");
      tdDzien.className = "rejestr-dzien";
      tdDzien.textContent = d;

      const tdCw = document.createElement("td");
      const wewn = document.createElement("table");
      wewn.className = "rejestr-cwiczenia";
      wewn.innerHTML = "<thead><tr><th>Partia</th><th>Ćwiczenie</th><th>Podejścia</th></tr></thead>";

      const wbody = document.createElement("tbody");
      grupy[d].forEach(function (w) {
        const wr = document.createElement("tr");

        const c1 = document.createElement("td");
        c1.className = "rejestr-partia";
        c1.appendChild(kropkaPartii(w.partia));
        c1.appendChild(document.createTextNode(w.partia));

        const c2 = document.createElement("td");
        c2.textContent = w.cwiczenie;

        const c3 = document.createElement("td");
        c3.textContent = (w.podejscia || []).map(function (p) {
          return p["cieżar"] + " kg × " + p.powtorzenia;
        }).join(", ");

        wr.appendChild(c1);
        wr.appendChild(c2);
        wr.appendChild(c3);
        wbody.appendChild(wr);
      });
      wewn.appendChild(wbody);
      tdCw.appendChild(wewn);

      tr.appendChild(tdDzien);
      tr.appendChild(tdCw);
      tbody.appendChild(tr);
    });
    tabela.appendChild(tbody);
    rejestrBox.appendChild(tabela);
  }

  // Pobranie wszystkich wpisów przy otwarciu strony
  async function wczytajWpisy() {
    const { data, error } = await db
      .from("treningi")
      .select("*")
      .order("data", { ascending: false });

    if (error) {
      console.error(error);
      alert("Nie udało się pobrać treningów: " + error.message);
      return;
    }
    (data || []).forEach(function (row) { wpisy.push(row); });
    renderOstatnio();
    renderRekord();
    renderRejestr();
    odswiezWykres();
  }
  wczytajWpisy();

  // ----- Wykres postępu (Chart.js) -----
  let wykres = null;

  function odswiezWykres() {
    const cwiczenie = selWykres.value;
    if (!cwiczenie) {
      wykresBrak.hidden = true;
      if (wykres) { wykres.destroy(); wykres = null; }
      return;
    }

    // max ciężaru per data dla wybranego ćwiczenia
    const perData = {};
    wpisy
      .filter(function (w) { return w.cwiczenie === cwiczenie; })
      .forEach(function (w) {
        const maxCiezar = (w.podejscia || []).reduce(function (m, p) {
          return Math.max(m, Number(p["cieżar"]) || 0);
        }, 0);
        if (!(w.data in perData) || maxCiezar > perData[w.data]) {
          perData[w.data] = maxCiezar;
        }
      });

    const daty = Object.keys(perData).sort();

    if (daty.length === 0) {
      wykresBrak.hidden = false;
      if (wykres) { wykres.destroy(); wykres = null; }
      return;
    }

    wykresBrak.hidden = true;
    const wartosci = daty.map(function (d) { return perData[d]; });

    if (wykres) wykres.destroy();
    wykres = new Chart(document.getElementById("wykres"), {
      type: "line",
      data: {
        labels: daty,
        datasets: [{
          label: "Najwyższy ciężar (kg) — " + cwiczenie,
          data: wartosci,
          borderColor: "#E2643F",
          backgroundColor: "rgba(226, 100, 63, 0.15)",
          tension: 0.2,
          pointRadius: 4
        }]
      },
      options: {
        scales: {
          x: { title: { display: true, text: "Data treningu" } },
          y: { title: { display: true, text: "Ciężar (kg)" }, beginAtZero: true }
        }
      }
    });
  }

  selWykres.addEventListener("change", odswiezWykres);

  // Submit
  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const partia = selPartia.value;
    const cwiczenie = selCwiczenie.value;
    const data = inputData.value;

    const podejscia = [];
    podejsciaBox.querySelectorAll(".set-row").forEach(function (row) {
      const ciezar = row.querySelector('input[name="ciezar"]').value;
      const powt = row.querySelector('input[name="powtorzenia"]').value;
      podejscia.push({ "cieżar": Number(ciezar), powtorzenia: Number(powt) });
    });

    const btn = form.querySelector(".btn-submit");
    btn.disabled = true;

    const { data: wstawione, error } = await db
      .from("treningi")
      .insert({ partia: partia, cwiczenie: cwiczenie, data: data, podejscia: podejscia })
      .select();

    btn.disabled = false;

    if (error) {
      console.error(error);
      alert("Nie udało się zapisać: " + error.message);
      return;
    }

    const nowyWpis = wstawione && wstawione[0] ? wstawione[0] : { partia, cwiczenie, data, podejscia };
    wpisy.push(nowyWpis);
    renderOstatnio();
    renderRekord();
    renderRejestr();
    if (selWykres.value === cwiczenie) odswiezWykres();

    form.reset();
    odbudujSelectCwiczenie();
    inputData.value = dzisiaj();
    resetPodejscia();
  });

  // Submit: dodanie nowego ćwiczenia do tabeli "cwiczenia"
  formNowe.addEventListener("submit", async function (e) {
    e.preventDefault();

    const partia = selNowePartia.value;
    const nazwa = inputNoweNazwa.value.trim();
    if (!partia || !nazwa) return;

    const istnieje = katalog.some(function (c) {
      return c.partia === partia && c.nazwa.toLowerCase() === nazwa.toLowerCase();
    });
    if (istnieje) {
      pokazStatusNowe("To ćwiczenie już jest w bazie dla tej partii.", false);
      return;
    }

    const btn = formNowe.querySelector(".btn-submit");
    btn.disabled = true;

    const { data: wstawione, error } = await db
      .from("cwiczenia")
      .insert({ partia: partia, nazwa: nazwa })
      .select();

    btn.disabled = false;

    if (error) {
      console.error(error);
      pokazStatusNowe("Nie udało się zapisać: " + error.message, false);
      return;
    }

    katalog.push(wstawione && wstawione[0] ? wstawione[0] : { partia: partia, nazwa: nazwa });
    odswiezSelectyCwiczen();
    formNowe.reset();
    pokazStatusNowe('Dodano: „' + nazwa + '" (' + partia + ")", true);
  });

  function pokazStatusNowe(tekst, ok) {
    noweStatus.textContent = tekst;
    noweStatus.style.color = ok ? "#2b7a2b" : "#b00020";
    noweStatus.hidden = false;
  }

  // Render katalogu ćwiczeń (widok "Dodaj nowe ćwiczenie") z przyciskiem usuwania
  function renderKatalogListy() {
    katalogLista.innerHTML = "";

    if (katalog.length === 0) {
      katalogLista.innerHTML = '<p class="pusto">Brak zapisanych ćwiczeń.</p>';
      return;
    }

    PARTIE.forEach(function (partia) {
      const wpisyPartii = katalog
        .filter(function (c) { return c.partia === partia; })
        .sort(function (a, b) { return a.nazwa.localeCompare(b.nazwa, "pl"); });
      if (wpisyPartii.length === 0) return;

      const grupa = document.createElement("div");
      grupa.className = "katalog-grupa";

      const naglowek = document.createElement("h4");
      naglowek.textContent = partia;
      grupa.appendChild(naglowek);

      wpisyPartii.forEach(function (c) {
        const wiersz = document.createElement("div");
        wiersz.className = "katalog-wiersz";

        const nazwa = document.createElement("span");
        nazwa.className = "katalog-nazwa";
        nazwa.appendChild(kropkaPartii(c.partia));
        nazwa.appendChild(document.createTextNode(c.nazwa));

        const btnUsun = document.createElement("button");
        btnUsun.type = "button";
        btnUsun.className = "btn-usun-cwiczenie";
        btnUsun.textContent = "usuń";
        btnUsun.addEventListener("click", function () { usunCwiczenie(c, btnUsun); });

        wiersz.appendChild(nazwa);
        wiersz.appendChild(btnUsun);
        grupa.appendChild(wiersz);
      });

      katalogLista.appendChild(grupa);
    });
  }

  // Usunięcie ćwiczenia z tabeli "cwiczenia"
  async function usunCwiczenie(cwicz, btn) {
    const potwierdzenie = window.confirm(
      'Usunąć ćwiczenie „' + cwicz.nazwa + '" (' + cwicz.partia + ") z katalogu?"
    );
    if (!potwierdzenie) return;

    btn.disabled = true;

    const { error } = await db
      .from("cwiczenia")
      .delete()
      .eq("id", cwicz.id);

    if (error) {
      console.error(error);
      alert("Nie udało się usunąć ćwiczenia: " + error.message);
      btn.disabled = false;
      return;
    }

    katalog = katalog.filter(function (c) { return c.id !== cwicz.id; });
    odswiezSelectyCwiczen();
  }
</script>
</body>
</html>
