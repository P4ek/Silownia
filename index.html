<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dziennik treningowy</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    color: #1a1a1a;
    background: #f6f6f6;
  }
  .kontener {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 16px 48px;
  }
  h1 { font-size: 1.4rem; padding-left: 44px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }

  /* ----- Hamburger + panel boczny ----- */
  .hamburger {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 60;
    width: 40px;
    height: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
  }
  .hamburger span {
    display: block;
    width: 18px;
    height: 2px;
    background: #1a1a1a;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    z-index: 40;
  }
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 260px;
    background: #fff;
    border-right: 1px solid #ddd;
    box-shadow: 2px 0 12px rgba(0, 0, 0, 0.12);
    transform: translateX(-100%);
    transition: transform 0.2s ease;
    z-index: 50;
    padding-top: 60px;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar h3 {
    margin: 0;
    padding: 12px 16px;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #888;
  }
  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    background: none;
    border: none;
    border-top: 1px solid #eee;
    font: inherit;
    cursor: pointer;
  }
  .nav-btn:hover { background: #f0f0f0; }
  .nav-btn.aktywny {
    background: #eaf3ea;
    font-weight: 600;
    box-shadow: inset 3px 0 0 #2b7a2b;
  }

  /* ----- Widoki ----- */
  .widok { display: none; }
  .widok.aktywny { display: block; }

  form {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
  }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  select, input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font: inherit;
  }
  fieldset { border: 1px solid #ddd; border-radius: 6px; margin-top: 12px; }
  legend { font-weight: 600; padding: 0 6px; }
  .set-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 8px;
    align-items: end;
  }
  .set-row label { margin: 0 0 4px; font-weight: 500; font-size: .85rem; }
  .set-row .field-weight, .set-row .field-reps { min-width: 0; }
  button {
    padding: 8px 14px;
    border: 1px solid #bbb;
    border-radius: 6px;
    background: #eee;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #e0e0e0; }
  .btn-remove {
    background: #fbe9e9;
    border-color: #e0b4b4;
    padding: 8px 12px;
  }
  .btn-submit {
    margin-top: 16px;
    width: 100%;
    background: #2b7a2b;
    border-color: #246824;
    color: #fff;
    font-weight: 600;
  }
  .btn-submit:hover { background: #246824; }

  #lista { margin-top: 12px; }
  .wpis {
    background: #fff;
    border: 1px solid #ddd;
    border-left: 4px solid #2b7a2b;
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .wpis-naglowek { font-weight: 600; margin-bottom: 2px; }
  .wpis-data { color: #666; font-size: .85rem; margin-bottom: 8px; }
  .wpis ul { margin: 0; padding-left: 20px; }
  .pusto { color: #888; }

  /* ----- Rejestr ćwiczeń ----- */
  .rejestr-tabela {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
  }
  .rejestr-tabela > thead th {
    text-align: left;
    padding: 10px 12px;
    background: #f0f0f0;
    border-bottom: 1px solid #ddd;
  }
  .rejestr-tabela > tbody > tr + tr { border-top: 2px solid #ddd; }
  .rejestr-tabela > tbody > tr > td {
    padding: 10px 12px;
    vertical-align: top;
  }
  .rejestr-dzien { font-weight: 600; white-space: nowrap; }
  .rejestr-cwiczenia {
    width: 100%;
    border-collapse: collapse;
  }
  .rejestr-cwiczenia th, .rejestr-cwiczenia td {
    text-align: left;
    padding: 4px 8px;
    border-bottom: 1px solid #eee;
    font-size: 0.9rem;
  }
  .rejestr-cwiczenia th { color: #666; font-weight: 600; }
  .rejestr-cwiczenia tr:last-child td { border-bottom: none; }

  /* ----- Wykres ----- */
  #widok-wykres .karta {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
  }
  #wykres-brak { color: #888; margin: 12px 0 0; }
</style>
</head>
<body>

<button class="hamburger" id="hamburger" aria-label="Menu">
  <span></span><span></span><span></span>
</button>

<div id="overlay" hidden></div>

<nav id="sidebar">
  <h3>Menu</h3>
  <button class="nav-btn aktywny" data-widok="widok-dodaj">Dodaj ćwiczenie</button>
  <button class="nav-btn" data-widok="widok-rejestr">Rejestr ćwiczeń</button>
  <button class="nav-btn" data-widok="widok-wykres">Wykres postępu</button>
</nav>

<div class="kontener">
  <h1>Dziennik treningowy</h1>

  <!-- ===== Widok 1: Dodaj ćwiczenie ===== -->
  <section id="widok-dodaj" class="widok aktywny">
    <h2>Dodaj ćwiczenie</h2>

    <form id="form-treningu">
      <label for="partia">Partia mięśniowa</label>
      <select id="partia" name="partia" required>
        <option value="">-- wybierz partię --</option>
      </select>

      <label for="cwiczenie">Ćwiczenie</label>
      <select id="cwiczenie" name="cwiczenie" required disabled>
        <option value="">-- najpierw wybierz partię --</option>
      </select>

      <label for="data">Data</label>
      <input type="date" id="data" name="data" required>

      <fieldset>
        <legend>Podejścia</legend>
        <div id="podejscia"></div>
        <button type="button" id="dodaj-podejscie">+ dodaj podejście</button>
      </fieldset>

      <button type="submit" class="btn-submit">Dodaj ćwiczenie</button>
    </form>

    <h2 style="margin-top:28px">Ostatnio dodane</h2>
    <div id="lista">
      <p class="pusto">Brak zapisanych treningów.</p>
    </div>
  </section>

  <!-- ===== Widok 2: Rejestr ćwiczeń ===== -->
  <section id="widok-rejestr" class="widok">
    <h2>Rejestr ćwiczeń</h2>
    <div id="rejestr">
      <p class="pusto">Brak zapisanych treningów.</p>
    </div>
  </section>

  <!-- ===== Widok 3: Wykres postępu ===== -->
  <section id="widok-wykres" class="widok">
    <h2>Wykres postępu</h2>
    <div class="karta">
      <label for="wykres-cwiczenie">Ćwiczenie</label>
      <select id="wykres-cwiczenie">
        <option value="">-- wybierz ćwiczenie --</option>
      </select>
      <canvas id="wykres" height="240"></canvas>
      <p id="wykres-brak" hidden>Brak jeszcze danych dla tego ćwiczenia</p>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const SUPABASE_URL = "https://yrnubpuffivauxatvthr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4nd418S2FdKpFmp5vGh1Ug_jltWAFrI";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CWICZENIA = {
    "Klata": [
      "wyciskanie na maszynie",
      "wyciskanie hantli ławka skośna",
      "rozpiętki hantlami",
      "rozpiętki na bramie góra",
      "rozpiętki na bramie dół"
    ],
    "Plecy": [
      "podciąganie",
      "wiosłowanie na wyciągu",
      "lat pulldown",
      "wiosłowanie na maszynie szerokim chwytem",
      "narciarz łamanym gryfem"
    ],
    "Biceps": [
      "spider curls",
      "uginanie ramion hantlami",
      "młotki na wyciągu",
      "młotki hantlami",
      "biceps gryfem łamanym",
      "uginanie ramion na maszynie"
    ],
    "Triceps": [
      "dipy",
      "prostowanie ramion na wyciągu metalowym gryfem",
      "triceps z nad głowy warkoczem",
      "triceps na wyciągu sznurem"
    ],
    "Barki": [
      "wznosy bokiem w oparciu o ławkę",
      "wznosy bokiem na maszynie",
      "wznosy bokiem na wyciągu",
      "wznosy bokiem brama",
      "wznosy bokiem hantlami na stojąco",
      "tył barku linką"
    ],
    "Brzuch": [
      "brzuch na drążku"
    ],
    "Nogi": [
      "bułgary",
      "przysiady",
      "prostowanie na maszynie",
      "uginanie na maszynie",
      "maszyna na łydki"
    ]
  };

  const form = document.getElementById("form-treningu");
  const selPartia = document.getElementById("partia");
  const selCwiczenie = document.getElementById("cwiczenie");
  const inputData = document.getElementById("data");
  const podejsciaBox = document.getElementById("podejscia");
  const btnDodaj = document.getElementById("dodaj-podejscie");
  const lista = document.getElementById("lista");
  const rejestrBox = document.getElementById("rejestr");
  const selWykres = document.getElementById("wykres-cwiczenie");
  const wykresBrak = document.getElementById("wykres-brak");

  // Wszystkie pobrane wpisy z tabeli "treningi"
  const wpisy = [];

  // ----- Nawigacja: hamburger + panel boczny -----
  const hamburger = document.getElementById("hamburger");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");
  const widoki = document.querySelectorAll(".widok");
  const navBtns = document.querySelectorAll(".nav-btn");

  function otworzPanel() {
    sidebar.classList.add("open");
    overlay.hidden = false;
  }
  function zamknijPanel() {
    sidebar.classList.remove("open");
    overlay.hidden = true;
  }
  hamburger.addEventListener("click", otworzPanel);
  overlay.addEventListener("click", zamknijPanel);

  navBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      const cel = btn.dataset.widok;
      widoki.forEach(function (w) { w.classList.toggle("aktywny", w.id === cel); });
      navBtns.forEach(function (b) { b.classList.toggle("aktywny", b === btn); });
      if (cel === "widok-rejestr") renderRejestr();
      zamknijPanel();
    });
  });

  // Wypełnienie selecta partii
  Object.keys(CWICZENIA).forEach(function (partia) {
    const opt = document.createElement("option");
    opt.value = partia;
    opt.textContent = partia;
    selPartia.appendChild(opt);
  });

  // Wypełnienie selecta wykresu wszystkimi ćwiczeniami ze wszystkich partii
  Object.keys(CWICZENIA).forEach(function (partia) {
    const grupa = document.createElement("optgroup");
    grupa.label = partia;
    CWICZENIA[partia].forEach(function (cw) {
      const opt = document.createElement("option");
      opt.value = cw;
      opt.textContent = cw;
      grupa.appendChild(opt);
    });
    selWykres.appendChild(grupa);
  });

  // Ustawienie dzisiejszej daty
  function dzisiaj() {
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
  }
  inputData.value = dzisiaj();

  // Aktualizacja listy ćwiczeń po wyborze partii
  selPartia.addEventListener("change", function () {
    const partia = selPartia.value;
    selCwiczenie.innerHTML = "";

    if (!partia) {
      selCwiczenie.disabled = true;
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "-- najpierw wybierz partię --";
      selCwiczenie.appendChild(opt);
      return;
    }

    selCwiczenie.disabled = false;
    const opt0 = document.createElement("option");
    opt0.value = "";
    opt0.textContent = "-- wybierz ćwiczenie --";
    selCwiczenie.appendChild(opt0);

    CWICZENIA[partia].forEach(function (cw) {
      const opt = document.createElement("option");
      opt.value = cw;
      opt.textContent = cw;
      selCwiczenie.appendChild(opt);
    });
  });

  // Wiersz podejścia
  function stworzWiersz() {
    const row = document.createElement("div");
    row.className = "set-row";

    const wrapW = document.createElement("div");
    wrapW.className = "field-weight";
    const labW = document.createElement("label");
    labW.textContent = "Ciężar (kg)";
    const inpW = document.createElement("input");
    inpW.type = "number";
    inpW.name = "ciezar";
    inpW.min = "0";
    inpW.step = "0.5";
    inpW.required = true;
    wrapW.appendChild(labW);
    wrapW.appendChild(inpW);

    const wrapR = document.createElement("div");
    wrapR.className = "field-reps";
    const labR = document.createElement("label");
    labR.textContent = "Powtórzenia";
    const inpR = document.createElement("input");
    inpR.type = "number";
    inpR.name = "powtorzenia";
    inpR.min = "1";
    inpR.step = "1";
    inpR.required = true;
    wrapR.appendChild(labR);
    wrapR.appendChild(inpR);

    const btnDel = document.createElement("button");
    btnDel.type = "button";
    btnDel.className = "btn-remove";
    btnDel.textContent = "usuń";
    btnDel.addEventListener("click", function () {
      row.remove();
      if (podejsciaBox.children.length === 0) {
        podejsciaBox.appendChild(stworzWiersz());
      }
    });

    row.appendChild(wrapW);
    row.appendChild(wrapR);
    row.appendChild(btnDel);
    return row;
  }

  function resetPodejscia() {
    podejsciaBox.innerHTML = "";
    podejsciaBox.appendChild(stworzWiersz());
  }
  resetPodejscia();

  btnDodaj.addEventListener("click", function () {
    podejsciaBox.appendChild(stworzWiersz());
  });

  // Budowa kafelka pojedynczego wpisu
  function budujWpis(row) {
    const wpis = document.createElement("div");
    wpis.className = "wpis";

    const naglowek = document.createElement("div");
    naglowek.className = "wpis-naglowek";
    naglowek.textContent = row.partia + " — " + row.cwiczenie;

    const dataEl = document.createElement("div");
    dataEl.className = "wpis-data";
    dataEl.textContent = row.data;

    const ul = document.createElement("ul");
    (row.podejscia || []).forEach(function (p, i) {
      const li = document.createElement("li");
      li.textContent = "Podejście " + (i + 1) + ": " + p["cieżar"] + " kg × " + p.powtorzenia;
      ul.appendChild(li);
    });

    wpis.appendChild(naglowek);
    wpis.appendChild(dataEl);
    wpis.appendChild(ul);
    return wpis;
  }

  // Render listy "Ostatnio dodane" - tylko wpisy z dzisiejszą datą (reset o północy)
  function renderOstatnio() {
    const dzis = dzisiaj();
    const dzisiejsze = wpisy.filter(function (w) { return w.data === dzis; });

    lista.innerHTML = "";
    if (dzisiejsze.length === 0) {
      lista.innerHTML = '<p class="pusto">Brak ćwiczeń dodanych dzisiaj.</p>';
      return;
    }
    dzisiejsze.slice().reverse().forEach(function (row) {
      lista.appendChild(budujWpis(row));
    });
  }

  // Zaplanuj odświeżenie listy tuż po najbliższej północy (i tak co dobę)
  function zaplanujResetOPolnocy() {
    const teraz = new Date();
    const polnoc = new Date(
      teraz.getFullYear(), teraz.getMonth(), teraz.getDate() + 1, 0, 0, 2
    );
    setTimeout(function () {
      renderOstatnio();
      zaplanujResetOPolnocy();
    }, polnoc - teraz);
  }
  zaplanujResetOPolnocy();

  // Render widoku "Rejestr ćwiczeń" - tabela pogrupowana po dniach
  function renderRejestr() {
    const grupy = {};
    wpisy.forEach(function (w) {
      (grupy[w.data] = grupy[w.data] || []).push(w);
    });
    const daty = Object.keys(grupy).sort().reverse();

    rejestrBox.innerHTML = "";
    if (daty.length === 0) {
      rejestrBox.innerHTML = '<p class="pusto">Brak zapisanych treningów.</p>';
      return;
    }

    const tabela = document.createElement("table");
    tabela.className = "rejestr-tabela";
    tabela.innerHTML = "<thead><tr><th>Dzień treningowy</th><th>Ćwiczenia</th></tr></thead>";

    const tbody = document.createElement("tbody");
    daty.forEach(function (d) {
      const tr = document.createElement("tr");

      const tdDzien = document.createElement("td");
      tdDzien.className = "rejestr-dzien";
      tdDzien.textContent = d;

      const tdCw = document.createElement("td");
      const wewn = document.createElement("table");
      wewn.className = "rejestr-cwiczenia";
      wewn.innerHTML = "<thead><tr><th>Partia</th><th>Ćwiczenie</th><th>Podejścia</th></tr></thead>";

      const wbody = document.createElement("tbody");
      grupy[d].forEach(function (w) {
        const wr = document.createElement("tr");

        const c1 = document.createElement("td");
        c1.textContent = w.partia;

        const c2 = document.createElement("td");
        c2.textContent = w.cwiczenie;

        const c3 = document.createElement("td");
        c3.textContent = (w.podejscia || []).map(function (p) {
          return p["cieżar"] + " kg × " + p.powtorzenia;
        }).join(", ");

        wr.appendChild(c1);
        wr.appendChild(c2);
        wr.appendChild(c3);
        wbody.appendChild(wr);
      });
      wewn.appendChild(wbody);
      tdCw.appendChild(wewn);

      tr.appendChild(tdDzien);
      tr.appendChild(tdCw);
      tbody.appendChild(tr);
    });
    tabela.appendChild(tbody);
    rejestrBox.appendChild(tabela);
  }

  // Pobranie wszystkich wpisów przy otwarciu strony
  async function wczytajWpisy() {
    const { data, error } = await db
      .from("treningi")
      .select("*")
      .order("data", { ascending: false });

    if (error) {
      console.error(error);
      alert("Nie udało się pobrać treningów: " + error.message);
      return;
    }
    (data || []).forEach(function (row) { wpisy.push(row); });
    renderOstatnio();
    renderRejestr();
    odswiezWykres();
  }
  wczytajWpisy();

  // ----- Wykres postępu (Chart.js) -----
  let wykres = null;

  function odswiezWykres() {
    const cwiczenie = selWykres.value;
    if (!cwiczenie) {
      wykresBrak.hidden = true;
      if (wykres) { wykres.destroy(); wykres = null; }
      return;
    }

    // max ciężaru per data dla wybranego ćwiczenia
    const perData = {};
    wpisy
      .filter(function (w) { return w.cwiczenie === cwiczenie; })
      .forEach(function (w) {
        const maxCiezar = (w.podejscia || []).reduce(function (m, p) {
          return Math.max(m, Number(p["cieżar"]) || 0);
        }, 0);
        if (!(w.data in perData) || maxCiezar > perData[w.data]) {
          perData[w.data] = maxCiezar;
        }
      });

    const daty = Object.keys(perData).sort();

    if (daty.length === 0) {
      wykresBrak.hidden = false;
      if (wykres) { wykres.destroy(); wykres = null; }
      return;
    }

    wykresBrak.hidden = true;
    const wartosci = daty.map(function (d) { return perData[d]; });

    if (wykres) wykres.destroy();
    wykres = new Chart(document.getElementById("wykres"), {
      type: "line",
      data: {
        labels: daty,
        datasets: [{
          label: "Najwyższy ciężar (kg) — " + cwiczenie,
          data: wartosci,
          borderColor: "#2b7a2b",
          backgroundColor: "rgba(43, 122, 43, 0.15)",
          tension: 0.2,
          pointRadius: 4
        }]
      },
      options: {
        scales: {
          x: { title: { display: true, text: "Data treningu" } },
          y: { title: { display: true, text: "Ciężar (kg)" }, beginAtZero: true }
        }
      }
    });
  }

  selWykres.addEventListener("change", odswiezWykres);

  // Submit
  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const partia = selPartia.value;
    const cwiczenie = selCwiczenie.value;
    const data = inputData.value;

    const podejscia = [];
    podejsciaBox.querySelectorAll(".set-row").forEach(function (row) {
      const ciezar = row.querySelector('input[name="ciezar"]').value;
      const powt = row.querySelector('input[name="powtorzenia"]').value;
      podejscia.push({ "cieżar": Number(ciezar), powtorzenia: Number(powt) });
    });

    const btn = form.querySelector(".btn-submit");
    btn.disabled = true;

    const { data: wstawione, error } = await db
      .from("treningi")
      .insert({ partia: partia, cwiczenie: cwiczenie, data: data, podejscia: podejscia })
      .select();

    btn.disabled = false;

    if (error) {
      console.error(error);
      alert("Nie udało się zapisać: " + error.message);
      return;
    }

    const nowyWpis = wstawione && wstawione[0] ? wstawione[0] : { partia, cwiczenie, data, podejscia };
    wpisy.push(nowyWpis);
    renderOstatnio();
    renderRejestr();
    if (selWykres.value === cwiczenie) odswiezWykres();

    form.reset();
    selCwiczenie.disabled = true;
    selCwiczenie.innerHTML = '<option value="">-- najpierw wybierz partię --</option>';
    inputData.value = dzisiaj();
    resetPodejscia();
  });
</script>
